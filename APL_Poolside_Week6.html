<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APL Poolside — Week 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --avissa: #7F77DD; --avissa-dark: #3C3489; --avissa-tint: #EEEDFE;
    --tata: #1D9E75; --tata-dark: #085041; --tata-tint: #E1F5EE;
    --reva: #D85A30; --reva-dark: #712B13; --reva-tint: #FAECE7;
    --tasha: #D4537E; --tasha-dark: #72243E; --tasha-tint: #FBEAF0;
    --saniya: #0E8FA8; --saniya-dark: #0A4A57; --saniya-tint: #E2F3F7;
    --dora: #639922; --dora-dark: #27500A; --dora-tint: #EAF3DE;
    --rendra: #534AB7; --rendra-dark: #26215C; --rendra-tint: #EEEDFE;
    --ink: #14161A; --paper: #FAFAF8; --line: #E4E2DC; --muted: #6B6E76;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--paper); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 100px; }
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .topbar .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: #9A9DA6; font-weight: 700; }
  .topbar .title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; margin-top: 2px; }
  .save-pill { font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 20px; background: #2A2D34; color: #9A9DA6; white-space: nowrap; }
  .save-pill.saved { background: #1D3B2A; color: #6FCF97; }
  .save-pill.failed { background: #4A1F1B; color: #F09A8E; }

  .athlete-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 61px; z-index: 40; scrollbar-width: none; }
  .athlete-tabs::-webkit-scrollbar { display: none; }
  .a-tab { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); border: 1.5px solid var(--line); white-space: nowrap; cursor: pointer; flex: none; }
  .a-tab.active { background: var(--dot); color: #fff; border-color: transparent; }
  .a-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
  .a-tab.active .dot { background: rgba(255,255,255,.5); }
  .a-tab .check { font-size: 11px; opacity: 0.8; }
  .a-tab .saved-mark { font-size: 11px; font-weight: 800; color: #2E9E63; margin-left: 3px; }

  main { padding: 0 16px; }
  .section-head { padding: 20px 0 8px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .section-head h2 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; color: var(--dot-dark); }
  .section-head .sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  .card { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .rep-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0eee8; }
  .rep-row:last-child { border-bottom: none; }
  .rep-num { width: 26px; height: 26px; border-radius: 8px; background: var(--dot-tint); color: var(--dot-dark); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; flex: none; margin-top: 2px; }
  .rep-fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 80px; }
  .field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; text-align: center; background: var(--paper); }
  .field input:focus { outline: none; border-color: var(--dot); background: #fff; }
  .field.time input { color: var(--dot-dark); }

  .sc-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: #FFF4E0; color: #8A5A00; margin-bottom: 10px; }
  .deviation-hint { font-size: 12px; color: var(--muted); padding: 6px 0 2px; text-align: center; }
  .deviation-hint .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--dot-dark); }

  .rep-note { margin-top: 8px; }
  .rep-note input { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; background: var(--paper); box-sizing: border-box; }
  .rep-note input:focus { outline: none; border-color: var(--dot); background: #fff; }
  .rep-note input::placeholder { color: #A9ABB2; font-size: 11.5px; }

  /* quality blocks (baik/cukup/kurang for Station A) */
  .quality-block { padding: 10px 0; border-bottom: 1px solid #f0eee8; }
  .quality-block:last-child { border-bottom: none; }
  .quality-set-label { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .quality-param { display: flex; align-items: flex-start; justify-content: space-between; padding: 6px 0; gap: 8px; flex-wrap: wrap; }
  .quality-param > .tap3 { flex-shrink: 0; }
  .quality-param-label { font-size: 12.5px; font-weight: 600; color: #444; }
  .tap3 { display: flex; gap: 4px; }
  .tap3 button { border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .sel-kurang.selected { background: #FEE2E2; border-color: #F87171; color: #B91C1C; }
  .sel-cukup.selected  { background: #FEF3C7; border-color: #FBBF24; color: #92400E; }
  .sel-baik.selected   { background: #DCFCE7; border-color: #4ADE80; color: #166534; }

  /* 1-5 rating for dryland */
  .rate5 { display: flex; gap: 4px; }
  .rate5 button { width: 38px; height: 34px; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; font-size: 14px; font-weight: 800; font-family: 'JetBrains Mono', monospace; cursor: pointer; color: var(--muted); transition: all .12s; }
  .rate5 button.r1 { background: #FEE2E2; border-color: #F87171; color: #B91C1C; }
  .rate5 button.r2 { background: #FFEDD5; border-color: #FB923C; color: #9A3412; }
  .rate5 button.r3 { background: #FEF3C7; border-color: #FBBF24; color: #92400E; }
  .rate5 button.r4 { background: #DCFCE7; border-color: #4ADE80; color: #166534; }
  .rate5 button.r5 { background: #D1FAE5; border-color: #10B981; color: #065F46; }

  /* main stroke selector */
  .ms-selector { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 16px; }
  .ms-btn { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; color: var(--muted); }
  .ms-btn.active { background: var(--dot); color: #fff; border-color: transparent; }

  /* criteria reference toggle */
  .criteria-toggle { font-size: 11px; font-weight: 700; color: var(--dot-dark); cursor: pointer; text-decoration: underline; margin-bottom: 8px; display: inline-block; }
  .criteria-panel { display: none; background: #f9f8f4; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; font-size: 11.5px; line-height: 1.5; }
  .criteria-panel.open { display: block; }
  .criteria-panel h4 { font-size: 12px; font-weight: 800; margin: 8px 0 4px; color: var(--ink); }
  .criteria-panel h4:first-child { margin-top: 0; }
  .criteria-panel .cr { display: flex; gap: 6px; padding: 2px 0; }
  .criteria-panel .cn { font-family: 'JetBrains Mono', monospace; font-weight: 700; min-width: 16px; }

  .note-box textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; min-height: 60px; resize: vertical; background: var(--paper); }
  .note-box textarea:focus { outline: none; border-color: var(--dot); background: #fff; }

  footer { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid var(--line); z-index: 50; }
  .btn-reset  { flex: 0 0 auto; padding: 13px 14px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid #E4E2DC; background: #fff; color: #B91C1C; }
  .btn-export { flex: 1; padding: 13px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border: none; background: var(--dot); color: #fff; }
  .btn-md     { flex: 1; padding: 13px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--dot); background: #fff; color: var(--dot); }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="label">APL Sprint Lab · Poolside</div>
    <div class="title">Week 6 — Main Stroke Resistance</div>
  </div>
  <div class="save-pill" id="savePill">belum disimpan</div>
</div>

<div class="athlete-tabs" id="athleteTabs"></div>

<main id="mainContent"></main>

<footer>
  <button class="btn-reset" onclick="resetAthlete()">Reset</button>
  <button class="btn-export" onclick="exportData()">Export TXT</button>
  <button class="btn-md" onclick="exportMD()">Export MD</button>
</footer>

<script>
const ATHLETES = [
  { key: "avissa", name: "Avissa", holdSC: 5 },
  { key: "tata",   name: "Tata",   holdSC: 5 },
  { key: "reva",   name: "Reva",   holdSC: 5 },
  { key: "tasha",  name: "Tasha",  holdSC: 5 },
  { key: "saniya", name: "Saniya", holdSC: 5 },
  { key: "dora",   name: "Dora",   holdSC: 8 },
  { key: "rendra", name: "Rendra", holdSC: 8 },
];

const MS_OPTIONS = [
  { key: "free",   label: "Freestyle" },
  { key: "fly",    label: "Butterfly" },
  { key: "back",   label: "Backstroke" },
  { key: "breast", label: "Breaststroke" },
];

const STORE_KEY = "apl_week6_data_v2";

// Kriteria penilaian parachute per main stroke
const MS_CRITERIA = {
  free:   { c1: 'Kualitas Kick', c2: 'Body Position',
            h1: 'Baik = kick memberi dorongan konsisten · Cukup = ada tapi turun · Kurang = hampir tidak ada',
            h2: 'Baik = badan rata di permukaan · Cukup = sedikit tenggelam · Kurang = pinggul jatuh' },
  fly:    { c1: 'Posisi Nafas (Vertikal / Horizontal)',
            c2: 'Hip Position',
            h1: 'Baik = kepala maju horizontal · Cukup = sedikit naik · Kurang = vertikal, propulsi terbuang ke atas',
            h2: 'Baik = hip tinggi stabil · Cukup = sesekali tenggelam · Kurang = hip tenggelam sepanjang set' },
  back:   { c1: 'Kualitas Kick (membantu stabilisasi)',
            c2: 'Body Position (Head-Chest-Hip)',
            h1: 'Baik = kick cukup untuk jaga badan stabil · Cukup = ada tapi tidak cukup · Kurang = tidak memberi stabilisasi',
            h2: 'Baik = head, chest, hip tinggi · Cukup = salah satu tenggelam · Kurang = badan keseluruhan rendah' },
  breast: { c1: 'Streamline Setelah Kick',
            c2: 'Hip Position',
            h1: 'Baik = body line lurus setiap glide · Cukup = sesekali putus · Kurang = langsung naikin rate, tidak jaga posisi',
            h2: 'Baik = hip stabil tinggi saat glide · Cukup = sedikit tenggelam · Kurang = hip tenggelam, rate naik untuk kompensasi' },
};



function loadStore() {
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch (e) { return {}; }
}
function writeStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); return true; }
  catch (e) { setSavePill("gagal menyimpan", false); return false; }
}
function setSavePill(text, ok) {
  const pill = document.getElementById('savePill');
  if (!pill) return;
  pill.textContent = text;
  pill.classList.toggle('saved', !!ok);
  pill.classList.remove('failed');
}

let saveTimers = {};
function autosave(key) {
  setSavePill("menyimpan...", false);
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => {
    const d = ensureAthlete(key);
    d.savedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    if (writeStore()) {
      const who = (ATHLETES.find(x => x.key === key) || {}).name || key;
      setSavePill(`${who} tersimpan ${d.savedAt}`, true);
      renderTabs();
    }
  }, 400);
}
function flushSave(key) {
  if (key && saveTimers[key]) {
    clearTimeout(saveTimers[key]);
    const d = ensureAthlete(key);
    d.savedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }
  writeStore();
}

function emptyAthleteData() {
  return {
    mainStroke: "free",
    kick: [null, null, null, null, null, null],  // 6 rep 25m Kick MAX
    dive15: [
      { time: null, uw: null, sc: null, holdNote: "", note: "" },
      { time: null, uw: null, sc: null, holdNote: "", note: "" },
      { time: null, uw: null, sc: null, holdNote: "", note: "" },
      { time: null, uw: null, sc: null, holdNote: "", note: "" },
    ],
    stationA: {
      // set1 dan set2 dinamis: medium hanya muncul kalau set1 sudah ok
      // crit1 & crit2 namanya bergantung mainStroke
      set1: { parachute: 'small', sc: null, crit1: null, crit2: null, ok: null },
      set2: { parachute: 'small', sc: null, crit1: null, crit2: null, note: '' },
    },
    stationB: {
      hipTap:      { bodyline: null, tempo: null, stabil: null },
      shoulderTap: { bodyline: null, tempo: null, stabil: null },
    },
    stationNote: "",
    coachNote: "",
    savedAt: "",
  };
}

function normalizeAthlete(raw) {
  const base = emptyAthleteData();
  if (!raw || typeof raw !== 'object') return base;
  if (raw.mainStroke) base.mainStroke = raw.mainStroke;
  if (Array.isArray(raw.kick)) { for (let i = 0; i < 6; i++) { if (raw.kick[i] !== undefined) base.kick[i] = raw.kick[i]; } }
  if (Array.isArray(raw.dive15)) {
    for (let i = 0; i < 4; i++) {
      const r = raw.dive15[i];
      if (!r || typeof r !== 'object') continue;
      base.dive15[i].time = r.time ?? null;
      base.dive15[i].uw = r.uw ?? null;
      base.dive15[i].sc = r.sc ?? null;
      base.dive15[i].holdNote = r.holdNote || "";
      base.dive15[i].note = r.note || "";
    }
  }
  if (raw.stationA && typeof raw.stationA === 'object') {
    ['set1','set2'].forEach(k => {
      const e = raw.stationA[k];
      if (e && typeof e === 'object') {
        if (e.parachute !== undefined) base.stationA[k].parachute = e.parachute;
        if (e.sc !== undefined) base.stationA[k].sc = e.sc;
        if (e.crit1 !== undefined) base.stationA[k].crit1 = e.crit1;
        if (e.crit2 !== undefined) base.stationA[k].crit2 = e.crit2;
        if ('ok' in base.stationA[k] && e.ok !== undefined) base.stationA[k].ok = e.ok;
        if ('note' in base.stationA[k] && typeof e.note === 'string') base.stationA[k].note = e.note;
      }
    });
  }
  if (raw.stationB && typeof raw.stationB === 'object') {
    ['hipTap','shoulderTap'].forEach(k => {
      const e = raw.stationB[k];
      if (e) { base.stationB[k].bodyline = e.bodyline ?? null; base.stationB[k].tempo = e.tempo ?? null; base.stationB[k].stabil = e.stabil ?? null; }
    });
  }
  if (typeof raw.stationNote === 'string') base.stationNote = raw.stationNote;
  if (typeof raw.coachNote === 'string') base.coachNote = raw.coachNote;
  if (typeof raw.savedAt === 'string') base.savedAt = raw.savedAt;
  return base;
}

let store = loadStore();
let activeKey = ATHLETES[0].key;
ATHLETES.forEach(a => { store[a.key] = normalizeAthlete(store[a.key]); });

function ensureAthlete(key) { if (!store[key]) store[key] = emptyAthleteData(); return store[key]; }

function renderTabs() {
  const wrap = document.getElementById('athleteTabs');
  wrap.innerHTML = '';
  ATHLETES.forEach(a => {
    const data = ensureAthlete(a.key);
    const filled = data.kick.filter(x => x !== null && x !== "").length +
                   data.dive15.filter(x => x.time !== null && x.time !== "").length;
    const total = 10;
    const tab = document.createElement('div');
    tab.className = 'a-tab' + (a.key === activeKey ? ' active' : '');
    tab.style.setProperty('--dot', `var(--${a.key})`);
    tab.onclick = () => { flushSave(activeKey); activeKey = a.key; render(); };
    const savedMark = data.savedAt ? `<span class="saved-mark" title="tersimpan ${data.savedAt}">✓</span>` : '';
    const msTag = data.mainStroke !== 'free' ? ` <span style="font-size:9px;opacity:.7">${data.mainStroke.toUpperCase()}</span>` : '';
    tab.innerHTML = `<span class="dot"></span>${a.name}${msTag}${filled > 0 ? `<span class="check">${filled}/${total}</span>` : ''}${savedMark}`;
    wrap.appendChild(tab);
  });
}

function fieldUpdate(key, path, value) {
  const data = ensureAthlete(key);
  const keys = path.split('.');
  let obj = data;
  for (let i = 0; i < keys.length - 1; i++) { const k = isNaN(keys[i]) ? keys[i] : parseInt(keys[i]); obj = obj[k]; }
  const last = keys[keys.length - 1];
  obj[isNaN(last) ? last : parseInt(last)] = value;
  autosave(key);
}
function tapUpdate(key, path, value) { fieldUpdate(key, path, value); render(); }

function computeDeviation(arr) {
  const nums = arr.filter(x => x !== null && x !== "" && !isNaN(parseFloat(x))).map(parseFloat);
  if (nums.length < 2) return null;
  return { first: nums[0], last: nums[nums.length - 1], delta: (nums[nums.length - 1] - nums[0]).toFixed(2) };
}

let criteriaOpen = false;

function render() {
  renderTabs();
  const a = ATHLETES.find(x => x.key === activeKey);
  const data = ensureAthlete(activeKey);
  const main = document.getElementById('mainContent');
  document.documentElement.style.setProperty('--dot', `var(--${a.key})`);
  main.style.setProperty('--dot', `var(--${a.key})`);
  main.style.setProperty('--dot-dark', `var(--${a.key}-dark)`);
  main.style.setProperty('--dot-tint', `var(--${a.key}-tint)`);

  const ms = data.mainStroke;
  const isBreast = ms === 'breast';
  const uwLabel = isBreast ? 'Pullout Dist' : 'Underwater Kick';
  const uwPlaceholder = isBreast ? 'meter' : '0';
  const uwStep = isBreast ? '0.5' : '1';

  const kickDev = computeDeviation(data.kick);
  const diveDev = computeDeviation(data.dive15.map(r => r.time));

  let html = '';

  // Main Stroke selector
  html += `<div class="section-head"><h2>Main Stroke</h2></div>`;
  html += `<div class="ms-selector">`;
  MS_OPTIONS.forEach(opt => {
    html += `<button class="ms-btn${ms === opt.key ? ' active' : ''}" onclick="tapUpdate('${a.key}','mainStroke','${opt.key}')">${opt.label}</button>`;
  });
  html += `</div>`;

  // Pre-Set: Vertical Kick + 25m Kick MAX (6 sets)
  html += `<div class="section-head"><h2>Pre-Set — Kick Engine</h2><span class="sub">6 set · 15s Vertical Kick + 25m Kick MAX (free)</span></div>`;
  html += `<div class="card">`;
  data.kick.forEach((val, i) => {
    html += `
      <div class="rep-row">
        <div class="rep-num">${i+1}</div>
        <div class="rep-fields">
          <div class="field time">
            <label>25m Kick (dtk)</label>
            <input type="number" step="0.01" inputmode="decimal" placeholder="0.00"
              value="${val !== null ? val : ''}"
              oninput="fieldUpdate('${a.key}', 'kick.${i}', this.value)">
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  if (kickDev) {
    html += `<div class="deviation-hint">Rep 1 → Rep 6: <span class="num">${kickDev.delta > 0 ? '+' : ''}${kickDev.delta}s</span> ${parseFloat(kickDev.delta) > 0 ? '(melambat)' : '(stabil/membaik)'}</div>`;
  }

  // Blok 1: Station Circuit
  html += `<div class="section-head"><h2>Blok 1 — Circuit Station</h2><span class="sub">kualitas per station</span></div>`;

  // Station A — Parachute (main stroke, criteria per gaya, progresif)
  const crit = MS_CRITERIA[ms];
  const sa = data.stationA;
  const set1ok = sa.set1.ok;  // 'ok' | 'kurang' | null

  function renderStationASet(setKey, setLabel, isParchSmall) {
    const sd = sa[setKey];
    const pLabel = sd.parachute === 'small' ? 'Small Parachute' : 'Medium Parachute';
    let out = `<div class="quality-block">`;
    out += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">`;
    out += `<div class="quality-set-label" style="margin:0">${setLabel} — ${pLabel}</div>`;
    if (sd.sc !== null && sd.sc !== undefined && sd.sc !== '')
      out += `<span style="font-size:11px;font-weight:700;color:var(--muted);">${sd.sc} SC</span>`;
    out += `</div>`;

    // SC input
    out += `<div class="quality-param"><div class="quality-param-label">Jumlah SC</div>
      <input type="number" step="1" inputmode="numeric" placeholder="berapa SC?"
        style="border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;width:110px;text-align:center;"
        value="${sd.sc !== null && sd.sc !== undefined ? sd.sc : ''}"
        oninput="fieldUpdate('${a.key}','stationA.${setKey}.sc',this.value)">
    </div>`;

    // crit1
    const c1 = sd.crit1;
    out += `<div class="quality-param" style="flex-direction:column;align-items:flex-start;gap:4px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="quality-param-label">${crit.c1}</div>
        <span style="font-size:10px;color:var(--muted);font-style:italic;">${crit.h1}</span>
      </div>
      <div class="tap3">
        <button class="sel-kurang${c1==='kurang'?' selected':''}" onclick="tapUpdate('${a.key}','stationA.${setKey}.crit1','${c1==='kurang'?'':'kurang'}')">Kurang</button>
        <button class="sel-cukup${c1==='cukup'?' selected':''}" onclick="tapUpdate('${a.key}','stationA.${setKey}.crit1','${c1==='cukup'?'':'cukup'}')">Cukup</button>
        <button class="sel-baik${c1==='baik'?' selected':''}" onclick="tapUpdate('${a.key}','stationA.${setKey}.crit1','${c1==='baik'?'':'baik'}')">Baik</button>
      </div>
    </div>`;

    // crit2
    const c2 = sd.crit2;
    out += `<div class="quality-param" style="flex-direction:column;align-items:flex-start;gap:4px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="quality-param-label">${crit.c2}</div>
        <span style="font-size:10px;color:var(--muted);font-style:italic;">${crit.h2}</span>
      </div>
      <div class="tap3">
        <button class="sel-kurang${c2==='kurang'?' selected':''}" onclick="tapUpdate('${a.key}','stationA.${setKey}.crit2','${c2==='kurang'?'':'kurang'}')">Kurang</button>
        <button class="sel-cukup${c2==='cukup'?' selected':''}" onclick="tapUpdate('${a.key}','stationA.${setKey}.crit2','${c2==='cukup'?'':'cukup'}')">Cukup</button>
        <button class="sel-baik${c2==='baik'?' selected':''}" onclick="tapUpdate('${a.key}','stationA.${setKey}.crit2','${c2==='baik'?'':'baik'}')">Baik</button>
      </div>
    </div>`;

    out += `</div>`;
    return out;
  }

  html += `<div class="card">`;
  html += `<div style="font-size:12.5px;font-weight:800;margin-bottom:4px;">Station A — Parachute (${MS_OPTIONS.find(o=>o.key===ms).label})</div>`;
  html += `<div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:12px;">Progresif: Small dulu. Kalau teknik jelek → Set 2 tetap Small dengan SC lebih sedikit.</div>`;

  // Set 1 selalu Small
  html += renderStationASet('set1', 'Set 1', true);

  // Keputusan progresif: tampil setelah Set 1 dinilai minimal satu kriteria
  if (sa.set1.crit1 !== null || sa.set1.crit2 !== null) {
    const isOk = set1ok === 'ok';
    const isKurang = set1ok === 'kurang';
    html += `<div style="padding:10px 0;border-top:1px solid #f0eee8;">`;
    html += `<div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">Keputusan Progresif Set 2</div>`;
    html += `<div style="display:flex;gap:8px;margin-bottom:8px;">
      <button style="flex:1;padding:10px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
        border:1.5px solid ${isOk?'#4ADE80':'var(--line)'};background:${isOk?'#DCFCE7':'#fff'};color:${isOk?'#166534':'var(--muted)'};"
        onclick="tapUpdate('${a.key}','stationA.set1.ok','${isOk?'':'ok'}');tapUpdate('${a.key}','stationA.set2.parachute','${isOk?'small':'medium'}')">
        ✓ Teknik OK → naik Medium
      </button>
      <button style="flex:1;padding:10px;border-radius:10px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
        border:1.5px solid ${isKurang?'#F87171':'var(--line)'};background:${isKurang?'#FEE2E2':'#fff'};color:${isKurang?'#B91C1C':'var(--muted)'};"
        onclick="tapUpdate('${a.key}','stationA.set1.ok','${isKurang?'':'kurang'}');tapUpdate('${a.key}','stationA.set2.parachute','small')">
        ✗ Teknik Jelek → tetap Small, SC lebih sedikit
      </button>
    </div>`;
    html += `</div>`;
    html += renderStationASet('set2', 'Set 2', sa.set2.parachute === 'small');
    // Catatan set 2
    html += `<div class="rep-note" style="margin-top:8px;">
      <input type="text" placeholder="catatan set 2 — cth: fokus perbaikan sudah terlihat, timing lebih baik"
        value="${(sa.set2.note||'').replace(/"/g,'&quot;')}"
        oninput="fieldUpdate('${a.key}','stationA.set2.note',this.value)">
    </div>`;
  } else {
    html += `<div style="padding:12px;background:#f9f8f4;border-radius:10px;font-size:12px;color:var(--muted);text-align:center;margin-top:4px;">
      Isi penilaian Set 1 dulu → pilihan Set 2 muncul di sini
    </div>`;
  }
  html += `</div>`;

  // Station B — Dryland (1-5 rating)
  html += `<div class="card">`;
  html += `<div style="font-size:12.5px; font-weight:800; margin-bottom:2px;">Station B — Dryland Dynamic Core</div>`;
  html += `<div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:6px;">25x2 Hip Tap · 25x2 Shoulder Tap</div>`;
  html += `<span class="criteria-toggle" onclick="criteriaOpen=!criteriaOpen;render();">${criteriaOpen ? '▼ Tutup' : '▶ Lihat'} standar penilaian 1-5</span>`;
  html += `<div class="criteria-panel${criteriaOpen ? ' open' : ''}">
    <h4>Body Line</h4>
    <div class="cr"><span class="cn">1</span> Pinggul jatuh/naik, badan melengkung, tidak ada kontrol</div>
    <div class="cr"><span class="cn">2</span> Tidak konsisten, pinggul sering bergeser</div>
    <div class="cr"><span class="cn">3</span> Cukup lurus di mayoritas rep, deviasi kecil sesekali</div>
    <div class="cr"><span class="cn">4</span> Lurus dan konsisten, deviasi sangat minimal</div>
    <div class="cr"><span class="cn">5</span> Sempurna dari awal sampai akhir, zero deviasi</div>
    <h4>Tempo</h4>
    <div class="cr"><span class="cn">1</span> Terlalu cepat tanpa kontrol, tidak ada jeda di posisi</div>
    <div class="cr"><span class="cn">2</span> Tidak konsisten, banyak yang terburu-buru</div>
    <div class="cr"><span class="cn">3</span> Cukup terkontrol, mayoritas sesuai hitungan</div>
    <div class="cr"><span class="cn">4</span> Konsisten terkontrol di hampir semua rep</div>
    <div class="cr"><span class="cn">5</span> Sempurna, setiap rep sesuai hitungan penuh</div>
    <h4>Stabilitas</h4>
    <div class="cr"><span class="cn">1</span> Goyang signifikan setiap kali tangan diangkat</div>
    <div class="cr"><span class="cn">2</span> Goyang cukup terlihat, ada kompensasi pinggul/bahu</div>
    <div class="cr"><span class="cn">3</span> Stabil di mayoritas rep, goyang kecil sesekali</div>
    <div class="cr"><span class="cn">4</span> Sangat stabil, goyang minimal di rep akhir saja</div>
    <div class="cr"><span class="cn">5</span> Zero goyang, kontrol penuh awal sampai akhir</div>
  </div>`;

  [['hipTap', 'Hip Tap Plank (25x2)'], ['shoulderTap', 'Shoulder Tap Plank (25x2)']].forEach(([exKey, exLabel]) => {
    const exData = data.stationB[exKey];
    html += `<div class="quality-block"><div class="quality-set-label">${exLabel}</div>`;
    [['bodyline', 'Body Line'], ['tempo', 'Tempo'], ['stabil', 'Stabilitas']].forEach(([paramKey, paramLabel]) => {
      const cur = exData[paramKey];
      html += `<div class="quality-param">
        <div class="quality-param-label">${paramLabel}</div>
        <div class="rate5">`;
      for (let n = 1; n <= 5; n++) {
        html += `<button class="${cur === n ? 'r'+n : ''}" onclick="tapUpdate('${a.key}', 'stationB.${exKey}.${paramKey}', ${cur === n ? 'null' : n})">${n}</button>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  // Station note
  html += `<div class="card note-box">
    <label style="display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:6px;">Catatan Blok 1 (opsional)</label>
    <textarea placeholder="catatan tambahan circuit station..." oninput="fieldUpdate('${a.key}', 'stationNote', this.value)">${data.stationNote || ''}</textarea>
  </div>`;

  // Blok 2: Contrast Set (Hold Sprint + 15m MAX Dive)
  html += `<div class="section-head"><h2>Blok 2 — Contrast Set (${MS_OPTIONS.find(o=>o.key===ms).label})</h2><span class="sub">4 set · hold sprint + 15m MAX dive</span></div>`;
  html += `<div class="sc-badge">Hold Sprint: ${a.holdSC} SC · Stretchcordz ditahan ke start block</div>`;
  html += `<div class="card">`;
  data.dive15.forEach((rep, i) => {
    html += `
      <div class="rep-row">
        <div class="rep-num">${i+1}</div>
        <div style="flex:1">
          <div style="margin-bottom:6px;">
            <span style="font-size:12px; font-weight:700; color:var(--muted);">Set ${i+1}</span>
          </div>
          <div class="rep-note" style="margin-top:0; margin-bottom:8px;">
            <input type="text" placeholder="catatan hold sprint — cth: timing pecah, undulasi hilang"
              value="${(rep.holdNote || '').replace(/"/g, '&quot;')}"
              oninput="fieldUpdate('${a.key}', 'dive15.${i}.holdNote', this.value)">
          </div>
          <div class="rep-fields">
            <div class="field time">
              <label>15m Waktu</label>
              <input type="number" step="0.01" inputmode="decimal" placeholder="0.00"
                value="${rep.time !== null ? rep.time : ''}"
                oninput="fieldUpdate('${a.key}', 'dive15.${i}.time', this.value)">
            </div>
            <div class="field">
              <label>${uwLabel}</label>
              <input type="number" step="${uwStep}" inputmode="${isBreast ? 'decimal' : 'numeric'}" placeholder="${uwPlaceholder}"
                value="${rep.uw !== null ? rep.uw : ''}"
                oninput="fieldUpdate('${a.key}', 'dive15.${i}.uw', this.value)">
            </div>
            <div class="field">
              <label>Stroke Count</label>
              <input type="number" step="1" inputmode="numeric" placeholder="0"
                value="${rep.sc !== null ? rep.sc : ''}"
                oninput="fieldUpdate('${a.key}', 'dive15.${i}.sc', this.value)">
            </div>
          </div>
          <div class="rep-note">
            <input type="text" placeholder="catatan 15m dive — cth: entry bagus, breakout lambat"
              value="${(rep.note || '').replace(/"/g, '&quot;')}"
              oninput="fieldUpdate('${a.key}', 'dive15.${i}.note', this.value)">
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  if (diveDev) {
    html += `<div class="deviation-hint">Waktu set 1 → set 4: <span class="num">${diveDev.delta > 0 ? '+' : ''}${diveDev.delta}s</span></div>`;
  }

  // Coach note
  html += `<div class="section-head"><h2>Catatan Coach</h2></div>`;
  html += `<div class="card note-box">
    <textarea placeholder="observasi umum atlet ini hari ini..." oninput="fieldUpdate('${a.key}', 'coachNote', this.value)">${data.coachNote || ''}</textarea>
  </div>`;

  main.innerHTML = html;
}

function resetAthlete() {
  const who = ATHLETES.find(x => x.key === activeKey).name;
  if (!confirm(`Reset semua data ${who} untuk Week 6?`)) return;
  clearTimeout(saveTimers[activeKey]);
  store[activeKey] = emptyAthleteData();
  writeStore();
  setSavePill(`${who} direset`, false);
  render();
}

function exportData() {
  const lines = [];
  lines.push("APL SPRINT LAB — WEEK 6 DATA EXPORT");
  lines.push("Main Stroke Resistance — " + new Date().toLocaleDateString('id-ID'));
  lines.push("=".repeat(50));
  ATHLETES.forEach(a => {
    const d = ensureAthlete(a.key);
    const msLabel = MS_OPTIONS.find(o => o.key === d.mainStroke)?.label || d.mainStroke;
    const isBreast = d.mainStroke === 'breast';
    lines.push("");
    lines.push(`--- ${a.name.toUpperCase()} [${msLabel}] (Hold: ${a.holdSC} SC) ---`);
    lines.push(`Main Stroke: ${msLabel}`);
    lines.push(`25m Kick MAX (6 rep): ${d.kick.map(v => v ?? '-').join(', ')}`);
    const kickDev = computeDeviation(d.kick);
    if (kickDev) lines.push(`  Deviasi rep1→rep6: ${kickDev.delta}s`);
    const cr = MS_CRITERIA[d.mainStroke];
    lines.push(`Station A (Parachute — ${msLabel}):`);
    ['set1','set2'].forEach((sk,i) => {
      const sd = d.stationA[sk];
      const pch = sd.parachute === 'small' ? 'Small' : 'Medium';
      const scStr = sd.sc ? `${sd.sc} SC` : '- SC';
      const okStr = sk==='set1' && sd.ok ? (sd.ok==='ok' ? '→ naik Medium' : '→ tetap Small') : '';
      lines.push(`  Set ${i+1} [${pch} ${scStr}] ${okStr}`);
      lines.push(`    ${cr.c1}: ${sd.crit1 ?? '-'} | ${cr.c2}: ${sd.crit2 ?? '-'}`);
      if (sd.note) lines.push(`    Catatan: ${sd.note}`);
    });
    lines.push(`Station B (Dryland Dynamic Core — 1-5 rating):`);
    lines.push(`  Hip Tap — Body Line: ${d.stationB.hipTap.bodyline ?? '-'} / Tempo: ${d.stationB.hipTap.tempo ?? '-'} / Stabilitas: ${d.stationB.hipTap.stabil ?? '-'}`);
    lines.push(`  Shoulder Tap — Body Line: ${d.stationB.shoulderTap.bodyline ?? '-'} / Tempo: ${d.stationB.shoulderTap.tempo ?? '-'} / Stabilitas: ${d.stationB.shoulderTap.stabil ?? '-'}`);
    if (d.stationNote) lines.push(`Catatan Blok 1: ${d.stationNote}`);
    lines.push(`Blok 2 — Contrast Set (${msLabel}):`);
    d.dive15.forEach((r, i) => {
      lines.push(`  Set ${i+1}:`);
      if (r.holdNote) lines.push(`    Hold Sprint: ${r.holdNote}`);
      lines.push(`    15m Dive: ${r.time ?? '-'}s / ${isBreast ? 'Pullout' : 'UW'} ${r.uw ?? '-'} / SC ${r.sc ?? '-'}`);
      if (r.note) lines.push(`    Catatan: ${r.note}`);
    });
    if (d.coachNote) lines.push(`Catatan Coach: ${d.coachNote}`);
  });
  const text = lines.join('\n');
  const jsonBlob = JSON.stringify(store, null, 2);
  const blob = new Blob([text + "\n\n\n=== RAW JSON ===\n" + jsonBlob], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `APL_Week6_Data_${new Date().toISOString().slice(0,10)}.txt`;
  link.click();
  URL.revokeObjectURL(url);
}

function buildMarkdown() {
  const date = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  const lines = [];
  lines.push(`# APL Sprint Lab — Laporan Sesi Week 6`);
  lines.push(`**Main Stroke Resistance — Contrast Set**`);
  lines.push(`**Tanggal:** ${date}  `);
  lines.push(`**Kolam:** UNNES Sampangan · 50m`);
  lines.push('');
  lines.push('---');
  lines.push('');

  ATHLETES.forEach(a => {
    const d = ensureAthlete(a.key);
    const msLabel = MS_OPTIONS.find(o => o.key === d.mainStroke)?.label || d.mainStroke;
    const isBreast = d.mainStroke === 'breast';
    const uwShort = isBreast ? 'Pullout (m)' : 'UW Kick';
    const cr = MS_CRITERIA[d.mainStroke];
    const kickDev = computeDeviation(d.kick);
    const diveDev = computeDeviation(d.dive15.map(r => r.time));

    lines.push(`## ${a.name}`);
    lines.push(`> **Main Stroke:** ${msLabel} · **Hold Sprint:** ${a.holdSC} SC`);
    lines.push('');

    // Pre-Set Kick
    lines.push(`### Pre-Set — 25m Kick MAX (6 rep, freestyle)`);
    lines.push('');
    lines.push('| Rep | Waktu (dtk) |');
    lines.push('|-----|-------------|');
    d.kick.forEach((v, i) => lines.push(`| ${i+1} | ${v ?? '—'} |`));
    if (kickDev) lines.push(`\n_Deviasi rep 1 → rep 6: **${kickDev.delta}s** ${parseFloat(kickDev.delta) > 0 ? '(melambat)' : '(stabil/membaik)'}_`);
    lines.push('');

    // Station A
    lines.push(`### Station A — Parachute (${msLabel})`);
    lines.push('');
    ['set1','set2'].forEach((sk, si) => {
      const sd = d.stationA[sk];
      if (!sd) return;
      const pLabel = sd.parachute === 'small' ? 'Small Parachute' : 'Medium Parachute';
      const scStr = sd.sc ? `${sd.sc} SC` : '— SC';
      let prog = '';
      if (sk === 'set1' && sd.ok) prog = sd.ok === 'ok' ? ' → naik Medium' : ' → tetap Small';
      lines.push(`**Set ${si+1} — ${pLabel} (${scStr})${prog}**`);
      lines.push(`- ${cr.c1}: **${sd.crit1 ?? '—'}**`);
      lines.push(`- ${cr.c2}: **${sd.crit2 ?? '—'}**`);
      if (sd.note) lines.push(`- _Catatan: ${sd.note}_`);
      lines.push('');
    });

    // Station B
    lines.push(`### Station B — Dryland Dynamic Core (1-5)`);
    lines.push('');
    lines.push(`| Latihan | Body Line | Tempo | Stabilitas |`);
    lines.push(`|---------|-----------|-------|------------|`);
    const sB = d.stationB;
    lines.push(`| Hip Tap Plank (25x2) | ${sB.hipTap.bodyline ?? '—'} | ${sB.hipTap.tempo ?? '—'} | ${sB.hipTap.stabil ?? '—'} |`);
    lines.push(`| Shoulder Tap Plank (25x2) | ${sB.shoulderTap.bodyline ?? '—'} | ${sB.shoulderTap.tempo ?? '—'} | ${sB.shoulderTap.stabil ?? '—'} |`);
    if (d.stationNote) lines.push(`\n_Catatan Blok 1: ${d.stationNote}_`);
    lines.push('');

    // Blok 2
    lines.push(`### Blok 2 — Contrast Set (${msLabel})`);
    lines.push('');
    lines.push(`| Set | Waktu 15m | ${uwShort} | Stroke Count |`);
    lines.push(`|-----|-----------|${isBreast ? '----------' : '---------'}|--------------|`);
    d.dive15.forEach((r, i) => {
      lines.push(`| ${i+1} | ${r.time ?? '—'}s | ${r.uw ?? '—'} | ${r.sc ?? '—'} |`);
    });
    lines.push('');
    d.dive15.forEach((r, i) => {
      const notes = [r.holdNote && `Hold: ${r.holdNote}`, r.note && `Dive: ${r.note}`].filter(Boolean);
      if (notes.length) lines.push(`_Set ${i+1} — ${notes.join(' · ')}_`);
    });
    if (diveDev) lines.push(`\n_Deviasi set 1 → set 4: **${diveDev.delta}s**_`);
    lines.push('');

    // Catatan Coach
    if (d.coachNote) {
      lines.push(`### Catatan Coach`);
      lines.push('');
      lines.push(`> ${d.coachNote}`);
      lines.push('');
    }

    lines.push('---');
    lines.push('');
  });

  lines.push(`_Export: ${new Date().toLocaleString('id-ID')} · APL Sprint Lab Week 6_`);
  return lines.join('\n');
}

function exportMD() {
  const md = buildMarkdown();
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `APL_Week6_${new Date().toISOString().slice(0,10)}.md`;
  link.click();
  URL.revokeObjectURL(url);
}

window.addEventListener('beforeunload', () => flushSave(activeKey));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave(activeKey);
});

(function initSaveStatus() {
  const saved = ATHLETES.map(a => ensureAthlete(a.key)).filter(d => d.savedAt);
  if (saved.length) setSavePill(`tersimpan ${saved[saved.length - 1].savedAt}`, true);
})();

render();
</script>
