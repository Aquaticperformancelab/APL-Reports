<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APL Poolside — Week 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --avissa: #7F77DD; --avissa-dark: #3C3489; --avissa-tint: #EEEDFE;
    --tata: #1D9E75; --tata-dark: #085041; --tata-tint: #E1F5EE;
    --reva: #D85A30; --reva-dark: #712B13; --reva-tint: #FAECE7;
    --tasha: #D4537E; --tasha-dark: #72243E; --tasha-tint: #FBEAF0;
    --saniya: #0E8FA8; --saniya-dark: #0A4A57; --saniya-tint: #E2F3F7;
    --dora: #639922; --dora-dark: #27500A; --dora-tint: #EAF3DE;
    --rendra: #534AB7; --rendra-dark: #26215C; --rendra-tint: #EEEDFE;
    --ink: #14161A;
    --paper: #FAFAF8;
    --line: #E4E2DC;
    --muted: #6B6E76;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 100px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--ink); color: #fff;
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: #9A9DA6; font-weight: 700; }
  .topbar .title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; margin-top: 2px; }
  .save-pill { font-size: 10px; font-weight: 700; padding: 5px 10px; border-radius: 20px; background: #2A2D34; color: #9A9DA6; white-space: nowrap; }
  .save-pill.saved { background: #1D3B2A; color: #6FCF97; }
  .save-pill.failed { background: #4A1F1B; color: #F09A8E; }

  .athlete-tabs {
    display: flex; overflow-x: auto; gap: 8px;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 61px; z-index: 40;
    scrollbar-width: none;
  }
  .athlete-tabs::-webkit-scrollbar { display: none; }
  .a-tab {
    flex: none; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: #fff; font-weight: 700; font-size: 13.5px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .a-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
  .a-tab.active { border-color: var(--dot); background: var(--dot); color: #fff; }
  .a-tab .check { font-size: 11px; opacity: 0.8; }
  .a-tab .saved-mark { font-size: 11px; font-weight: 800; color: #2E9E63; margin-left: 3px; }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 22px 0 10px;
  }
  .section-head h2 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; }
  .section-head .sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .section-head:first-child { margin-top: 4px; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .rep-row {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
    padding: 8px 0;
  }
  .rep-row + .rep-row { border-top: 1px dashed var(--line); }
  .rep-num {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px;
    color: #fff; background: var(--dot); width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .rep-fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 78px; }
  .field label {
    display: block; font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 3px;
  }
  .field input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 8px;
    padding: 9px 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700;
    color: var(--ink); background: var(--paper);
  }
  .field input:focus { outline: none; border-color: var(--dot); background: #fff; }
  .field.time input { color: var(--dot-dark); }

  .sc-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 20px; background: #FFF4E0; color: #8A5A00;
    margin-bottom: 10px;
  }

  .station-check {
    display: flex; align-items: center; gap: 10px; padding: 12px 4px;
  }
  .station-check + .station-check { border-top: 1px dashed var(--line); }
  .station-check input[type="checkbox"] {
    width: 22px; height: 22px; accent-color: var(--dot); flex: none;
  }
  .station-check .txt { font-size: 13.5px; font-weight: 600; }
  .station-check .txt .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 1px; }

  .quality-block { padding: 10px 0; }
  .quality-block + .quality-block { border-top: 1px dashed var(--line); }
  .quality-set-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dot-dark); margin-bottom: 8px;
  }
  .quality-param { margin-bottom: 10px; }
  .quality-param:last-child { margin-bottom: 0; }
  .quality-param-label { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .tap3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .tap3 button {
    padding: 10px 4px; border-radius: 9px; border: 1.5px solid var(--line);
    background: var(--paper); font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11.5px; font-weight: 700; color: var(--muted);
  }
  .tap3 button.sel-kurang.selected { background: #FBE7E5; border-color: #D9776E; color: #A8382B; }
  .tap3 button.sel-cukup.selected { background: #FFF3D6; border-color: #D9A63E; color: #8A6300; }
  .tap3 button.sel-baik.selected { background: #E1F3E3; border-color: #4F9E63; color: #1F6B34; }

  .note-box textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px;
    resize: vertical; min-height: 60px; background: var(--paper);
  }
  .note-box textarea:focus { outline: none; border-color: var(--dot); background: #fff; }

  .rep-note { margin-top: 8px; }
  .rep-note input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px;
    background: var(--paper); box-sizing: border-box;
  }
  .rep-note input:focus { outline: none; border-color: var(--dot); background: #fff; }
  .rep-note input::placeholder { color: #A9ABB2; font-size: 11.5px; }

  .deviation-hint {
    font-size: 11.5px; color: var(--muted); margin-top: 8px; padding: 8px 10px;
    background: var(--dot-tint); border-radius: 8px; font-weight: 600;
  }
  .deviation-hint .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--dot-dark); }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: #fff; border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px;
  }
  footer button {
    flex: 1; padding: 13px; border-radius: 10px; border: none;
    font-weight: 800; font-size: 13.5px; font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .btn-export { background: var(--ink); color: #fff; }
  .btn-reset { background: #fff; color: #B3261E; border: 1.5px solid #F0D0CE !important; }

  .empty-hint { font-size: 12px; color: var(--muted); text-align: center; padding: 20px 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="label">APL Sprint Lab · Poolside</div>
    <div class="title">Week 5 — Resisted Swimming</div>
  </div>
  <div class="save-pill" id="savePill">belum disimpan</div>
</div>

<div class="athlete-tabs" id="athleteTabs"></div>

<main id="mainContent"></main>

<footer>
  <button class="btn-reset" onclick="resetAthlete()">Reset atlet ini</button>
  <button class="btn-export" onclick="exportData()">Export semua data</button>
</footer>

<script>
const ATHLETES = [
  { key: "avissa", name: "Avissa", sc: false },
  { key: "tata",   name: "Tata",   sc: false },
  { key: "reva",   name: "Reva",   sc: false },
  { key: "tasha",  name: "Tasha",  sc: false },
  { key: "saniya", name: "Saniya", sc: false },
  { key: "dora",   name: "Dora",   sc: true },
  { key: "rendra", name: "Rendra", sc: true },
];
// sc: true = pakai 5 stretchcordz (bukan default) di SC Hold Sprint

const STORE_KEY = "apl_week5_data_v1";

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function writeStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    return true;
  } catch (e) {
    const pill = document.getElementById('savePill');
    if (pill) {
      pill.textContent = "gagal menyimpan";
      pill.classList.remove('saved');
      pill.classList.add('failed');
    }
    return false;
  }
}

function setSavePill(text, ok) {
  const pill = document.getElementById('savePill');
  if (!pill) return;
  pill.textContent = text;
  pill.classList.toggle('saved', !!ok);
  pill.classList.remove('failed');
}

// Autosave per atlet: debounce 400ms supaya aman saat mengetik cepat di poolside
let saveTimers = {};
function autosave(key) {
  setSavePill("menyimpan...", false);
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(() => {
    const d = ensureAthlete(key);
    const now = new Date();
    d.savedAt = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    if (writeStore()) {
      const who = (ATHLETES.find(x => x.key === key) || {}).name || key;
      setSavePill(`${who} tersimpan ${d.savedAt}`, true);
      renderTabs();
    }
  }, 400);
}

// Simpan segera tanpa menunggu debounce (dipakai saat ganti atlet / tutup halaman)
function flushSave(key) {
  if (key && saveTimers[key]) {
    clearTimeout(saveTimers[key]);
    const d = ensureAthlete(key);
    d.savedAt = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }
  writeStore();
}

function emptyAthleteData() {
  return {
    kick25: [null, null, null],           // waktu 3 rep, Pre-Set 25m Max Kick
    dive15: [                              // 4 rep Blok 2, semua Free (no Main Stroke di Week 5)
      { time: null, uw: null, sc: null, note: "" },
      { time: null, uw: null, sc: null, note: "" },
      { time: null, uw: null, sc: null, note: "" },
      { time: null, uw: null, sc: null, note: "" },
    ],
    stationA: {
      // Parachute — 2 set (Small, Medium), tiap set 2 param: kick, body
      small:  { kick: null, body: null },
      medium: { kick: null, body: null },
    },
    stationB: {
      // Dryland core — tiap exercise 3 param: bodyline, tempo, stabilitas
      deadbug:     { bodyline: null, tempo: null, stabil: null },
      shoulderTap: { bodyline: null, tempo: null, stabil: null },
    },
    scHoldNote: "",     // catatan bebas tambahan Blok 1 (opsional)
    coachNote: "",      // catatan umum sesi
    savedAt: "",        // waktu autosave terakhir untuk atlet ini
  };
}

// Normalisasi: data lama dari versi form sebelumnya dilengkapi ke schema terbaru
// tanpa menghapus angka yang sudah terisi. Ini mencegah crash saat field baru belum ada.
function normalizeAthlete(raw) {
  const base = emptyAthleteData();
  if (!raw || typeof raw !== 'object') return base;

  // kick25: 3 slot
  if (Array.isArray(raw.kick25)) {
    for (let i = 0; i < 3; i++) {
      if (raw.kick25[i] !== undefined) base.kick25[i] = raw.kick25[i];
    }
  }

  // dive15: 4 rep, buang field lama (type), pertahankan note kalau ada
  if (Array.isArray(raw.dive15)) {
    for (let i = 0; i < 4; i++) {
      const r = raw.dive15[i];
      if (!r || typeof r !== 'object') continue;
      base.dive15[i].time = r.time !== undefined ? r.time : null;
      base.dive15[i].uw   = r.uw   !== undefined ? r.uw   : null;
      base.dive15[i].sc   = r.sc   !== undefined ? r.sc   : null;
      base.dive15[i].note = typeof r.note === 'string' ? r.note : "";
    }
  }

  // stationA
  if (raw.stationA && typeof raw.stationA === 'object') {
    ['small', 'medium'].forEach(setKey => {
      const s = raw.stationA[setKey];
      if (s && typeof s === 'object') {
        if (s.kick !== undefined) base.stationA[setKey].kick = s.kick;
        if (s.body !== undefined) base.stationA[setKey].body = s.body;
      }
    });
  }

  // stationB: migrasi 'lumbar' (nama lama) ke 'bodyline'
  if (raw.stationB && typeof raw.stationB === 'object') {
    ['deadbug', 'shoulderTap'].forEach(exKey => {
      const e = raw.stationB[exKey];
      if (e && typeof e === 'object') {
        if (e.bodyline !== undefined) base.stationB[exKey].bodyline = e.bodyline;
        else if (e.lumbar !== undefined) base.stationB[exKey].bodyline = e.lumbar;
        if (e.tempo  !== undefined) base.stationB[exKey].tempo  = e.tempo;
        if (e.stabil !== undefined) base.stationB[exKey].stabil = e.stabil;
      }
    });
  }

  if (typeof raw.scHoldNote === 'string') base.scHoldNote = raw.scHoldNote;
  if (typeof raw.coachNote  === 'string') base.coachNote  = raw.coachNote;
  if (typeof raw.savedAt    === 'string') base.savedAt    = raw.savedAt;

  return base;
}

let store = loadStore();
let activeKey = ATHLETES[0].key;

// Normalisasi seluruh data tersimpan saat form dibuka
ATHLETES.forEach(a => { store[a.key] = normalizeAthlete(store[a.key]); });

function ensureAthlete(key) {
  if (!store[key]) store[key] = emptyAthleteData();
  return store[key];
}

function renderTabs() {
  const wrap = document.getElementById('athleteTabs');
  wrap.innerHTML = '';
  ATHLETES.forEach(a => {
    const data = ensureAthlete(a.key);
    const filled = data.kick25.filter(x => x !== null && x !== "").length +
                   data.dive15.filter(x => x.time !== null && x.time !== "").length;
    const tab = document.createElement('div');
    tab.className = 'a-tab' + (a.key === activeKey ? ' active' : '');
    tab.style.setProperty('--dot', `var(--${a.key})`);
    tab.onclick = () => { flushSave(activeKey); activeKey = a.key; render(); };
    const savedMark = data.savedAt ? `<span class="saved-mark" title="tersimpan ${data.savedAt}">✓</span>` : '';
    tab.innerHTML = `<span class="dot"></span>${a.name}${filled > 0 ? `<span class="check">${filled}/7</span>` : ''}${savedMark}`;
    wrap.appendChild(tab);
  });
}

function fieldUpdate(key, path, value) {
  const data = ensureAthlete(key);
  const keys = path.split('.');
  let obj = data;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = isNaN(keys[i]) ? keys[i] : parseInt(keys[i]);
    obj = obj[k];
  }
  const last = keys[keys.length - 1];
  obj[isNaN(last) ? last : parseInt(last)] = value;
  autosave(key);
}

function tapUpdate(key, path, value) {
  fieldUpdate(key, path, value);
  render();
}

function computeDeviation(arr) {
  const nums = arr.filter(x => x !== null && x !== "" && !isNaN(parseFloat(x))).map(parseFloat);
  if (nums.length < 2) return null;
  return { first: nums[0], last: nums[nums.length - 1], delta: (nums[nums.length - 1] - nums[0]).toFixed(2) };
}

function render() {
  renderTabs();
  const a = ATHLETES.find(x => x.key === activeKey);
  const data = ensureAthlete(activeKey);
  const main = document.getElementById('mainContent');
  document.documentElement.style.setProperty('--dot', `var(--${a.key})`);

  const kickDev = computeDeviation(data.kick25);
  const diveDev = computeDeviation(data.dive15.map(r => r.time));

  main.style.setProperty('--dot', `var(--${a.key})`);
  main.style.setProperty('--dot-dark', `var(--${a.key}-dark)`);
  main.style.setProperty('--dot-tint', `var(--${a.key}-tint)`);

  let html = '';

  // Pre-Set: 25m Max Kick
  html += `<div class="section-head"><h2>Pre-Set — 25m Max Kick</h2><span class="sub">3 rep · waktu saja</span></div>`;
  html += `<div class="card">`;
  data.kick25.forEach((val, i) => {
    html += `
      <div class="rep-row">
        <div class="rep-num">${i+1}</div>
        <div class="rep-fields">
          <div class="field time">
            <label>Waktu (detik)</label>
            <input type="number" step="0.01" inputmode="decimal" placeholder="0.00"
              value="${val !== null ? val : ''}"
              oninput="fieldUpdate('${a.key}', 'kick25.${i}', this.value)">
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  if (kickDev) {
    html += `<div class="deviation-hint">Deviasi rep 1 → rep 3: <span class="num">${kickDev.delta > 0 ? '+' : ''}${kickDev.delta}s</span> ${kickDev.delta > 0 ? '(melambat, cek maintenance)' : '(stabil/membaik)'}</div>`;
  }

  // Blok 2: 15m Max Dive
  html += `<div class="section-head"><h2>Blok 2 — 15m Max Dive</h2><span class="sub">4 rep · waktu + UW count + stroke count</span></div>`;
  if (a.sc) {
    html += `<div class="sc-badge">⚠ ${a.name} pakai 5 stretchcordz (bukan default)</div>`;
  }
  html += `<div class="card">`;
  data.dive15.forEach((rep, i) => {
    html += `
      <div class="rep-row">
        <div class="rep-num">${i+1}</div>
        <div style="flex:1">
          <div style="margin-bottom:6px;">
            <span style="font-size:12px; font-weight:700; color:var(--muted);">Rep ${i+1}</span>
          </div>
          <div class="rep-fields">
            <div class="field time">
              <label>Waktu (dtk)</label>
              <input type="number" step="0.01" inputmode="decimal" placeholder="0.00"
                value="${rep.time !== null ? rep.time : ''}"
                oninput="fieldUpdate('${a.key}', 'dive15.${i}.time', this.value)">
            </div>
            <div class="field">
              <label>Underwater Kick</label>
              <input type="number" step="1" inputmode="numeric" placeholder="0"
                value="${rep.uw !== null ? rep.uw : ''}"
                oninput="fieldUpdate('${a.key}', 'dive15.${i}.uw', this.value)">
            </div>
            <div class="field">
              <label>Stroke Count</label>
              <input type="number" step="1" inputmode="numeric" placeholder="0"
                value="${rep.sc !== null ? rep.sc : ''}"
                oninput="fieldUpdate('${a.key}', 'dive15.${i}.sc', this.value)">
            </div>
          </div>
          <div class="rep-note">
            <input type="text" placeholder="catatan pelatih rep ini — cth: entry terlalu dalam, breakout lambat, streamline kendur"
              value="${(rep.note || '').replace(/"/g, '&quot;')}"
              oninput="fieldUpdate('${a.key}', 'dive15.${i}.note', this.value)">
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;
  if (diveDev) {
    html += `<div class="deviation-hint">Waktu rep pertama → terakhir: <span class="num">${diveDev.delta > 0 ? '+' : ''}${diveDev.delta}s</span></div>`;
  }

  // Blok 1: Station quality checklist
  html += `<div class="section-head"><h2>Blok 1 — Circuit Station</h2><span class="sub">kualitas, tap sekali jalan</span></div>`;

  // Station A — Parachute
  html += `<div class="card">`;
  html += `<div style="font-size:12.5px; font-weight:800; margin-bottom:2px;">Station A — Parachute</div>`;
  html += `<div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:10px;">2x8 SC small · 2x5 SC medium</div>`;
  [['small', 'Set 1 — Small Parachute'], ['medium', 'Set 2 — Medium Parachute']].forEach(([setKey, setLabel]) => {
    const setData = data.stationA[setKey];
    html += `<div class="quality-block">`;
    html += `<div class="quality-set-label">${setLabel}</div>`;
    [['kick', 'Kualitas Kick'], ['body', 'Body Position']].forEach(([paramKey, paramLabel]) => {
      const cur = setData[paramKey];
      html += `<div class="quality-param">
        <div class="quality-param-label">${paramLabel}</div>
        <div class="tap3">
          <button class="sel-kurang${cur === 'kurang' ? ' selected' : ''}" onclick="tapUpdate('${a.key}', 'stationA.${setKey}.${paramKey}', '${cur === 'kurang' ? '' : 'kurang'}')">Kurang</button>
          <button class="sel-cukup${cur === 'cukup' ? ' selected' : ''}" onclick="tapUpdate('${a.key}', 'stationA.${setKey}.${paramKey}', '${cur === 'cukup' ? '' : 'cukup'}')">Cukup</button>
          <button class="sel-baik${cur === 'baik' ? ' selected' : ''}" onclick="tapUpdate('${a.key}', 'stationA.${setKey}.${paramKey}', '${cur === 'baik' ? '' : 'baik'}')">Baik</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  // Station B — Dryland core
  html += `<div class="card">`;
  html += `<div style="font-size:12.5px; font-weight:800; margin-bottom:2px;">Station B — Dryland Core</div>`;
  html += `<div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:10px;">15x Double Dead Bug · 15x Shoulder Tap Plank</div>`;
  [['deadbug', 'Double Dead Bug'], ['shoulderTap', 'Shoulder Tap Plank']].forEach(([exKey, exLabel]) => {
    const exData = data.stationB[exKey];
    html += `<div class="quality-block">`;
    html += `<div class="quality-set-label">${exLabel}</div>`;
    [['bodyline', 'Body Line'], ['tempo', 'Tempo Terkontrol'], ['stabil', 'Stabilitas']].forEach(([paramKey, paramLabel]) => {
      const cur = exData[paramKey];
      html += `<div class="quality-param">
        <div class="quality-param-label">${paramLabel}</div>
        <div class="tap3">
          <button class="sel-kurang${cur === 'kurang' ? ' selected' : ''}" onclick="tapUpdate('${a.key}', 'stationB.${exKey}.${paramKey}', '${cur === 'kurang' ? '' : 'kurang'}')">Kurang</button>
          <button class="sel-cukup${cur === 'cukup' ? ' selected' : ''}" onclick="tapUpdate('${a.key}', 'stationB.${exKey}.${paramKey}', '${cur === 'cukup' ? '' : 'cukup'}')">Cukup</button>
          <button class="sel-baik${cur === 'baik' ? ' selected' : ''}" onclick="tapUpdate('${a.key}', 'stationB.${exKey}.${paramKey}', '${cur === 'baik' ? '' : 'baik'}')">Baik</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  html += `<div class="card note-box">
    <label style="display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:6px;">Catatan tambahan Blok 1 (opsional)</label>
    <textarea placeholder="cth: collapse spesifik di rep terakhir, konteks lain yang tidak tertangkap checklist..." oninput="fieldUpdate('${a.key}', 'scHoldNote', this.value)">${data.scHoldNote || ''}</textarea>
  </div>`;


  // General coach note
  html += `<div class="section-head"><h2>Catatan Coach</h2></div>`;
  html += `<div class="card note-box">
    <textarea placeholder="observasi umum atlet ini hari ini..." oninput="fieldUpdate('${a.key}', 'coachNote', this.value)">${data.coachNote || ''}</textarea>
  </div>`;

  main.innerHTML = html;
}

function resetAthlete() {
  const who = ATHLETES.find(x => x.key === activeKey).name;
  if (!confirm(`Reset semua data ${who} untuk Week 5?`)) return;
  clearTimeout(saveTimers[activeKey]);
  store[activeKey] = emptyAthleteData();
  writeStore();
  setSavePill(`${who} direset`, false);
  render();
}

function exportData() {
  const lines = [];
  lines.push("APL SPRINT LAB — WEEK 5 DATA EXPORT");
  lines.push("Resisted Swimming — " + new Date().toLocaleDateString('id-ID'));
  lines.push("=".repeat(50));
  ATHLETES.forEach(a => {
    const d = ensureAthlete(a.key);
    lines.push("");
    lines.push(`--- ${a.name.toUpperCase()}${a.sc ? ' (5 SC)' : ''} ---`);
    lines.push(`25m Max Kick: ${d.kick25.map(v => v ?? '-').join(', ')}`);
    const kickDev = computeDeviation(d.kick25);
    if (kickDev) lines.push(`  Deviasi rep1→rep3: ${kickDev.delta}s`);
    lines.push(`15m Max Dive (waktu / Underwater Kick / Stroke Count):`);
    d.dive15.forEach((r, i) => {
      lines.push(`  Rep ${i+1}: ${r.time ?? '-'}s / UW ${r.uw ?? '-'} / SC ${r.sc ?? '-'}`);
      if (r.note) lines.push(`    Catatan pelatih: ${r.note}`);
    });
    lines.push(`Station A (Parachute):`);
    lines.push(`  Small — Kick: ${d.stationA.small.kick ?? '-'} / Body Position: ${d.stationA.small.body ?? '-'}`);
    lines.push(`  Medium — Kick: ${d.stationA.medium.kick ?? '-'} / Body Position: ${d.stationA.medium.body ?? '-'}`);
    lines.push(`Station B (Dryland Core):`);
    lines.push(`  Dead Bug — Body Line: ${d.stationB.deadbug.bodyline ?? '-'} / Tempo: ${d.stationB.deadbug.tempo ?? '-'} / Stabilitas: ${d.stationB.deadbug.stabil ?? '-'}`);
    lines.push(`  Shoulder Tap — Body Line: ${d.stationB.shoulderTap.bodyline ?? '-'} / Tempo: ${d.stationB.shoulderTap.tempo ?? '-'} / Stabilitas: ${d.stationB.shoulderTap.stabil ?? '-'}`);
    if (d.scHoldNote) lines.push(`Catatan Blok 1: ${d.scHoldNote}`);
    if (d.coachNote) lines.push(`Catatan Coach: ${d.coachNote}`);
  });
  const text = lines.join('\n');
  const jsonBlob = JSON.stringify(store, null, 2);

  const blob = new Blob([text + "\n\n\n=== RAW JSON (untuk import ke report) ===\n" + jsonBlob], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `APL_Week5_Data_${new Date().toISOString().slice(0,10)}.txt`;
  link.click();
  URL.revokeObjectURL(url);
}

// Pengaman: simpan segera kalau halaman ditutup atau layar HP terkunci
window.addEventListener('beforeunload', () => flushSave(activeKey));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave(activeKey);
});

// Tampilkan status simpan terakhir saat form dibuka kembali
(function initSaveStatus() {
  const saved = ATHLETES.map(a => ensureAthlete(a.key)).filter(d => d.savedAt);
  if (saved.length) setSavePill(`tersimpan ${saved[saved.length - 1].savedAt}`, true);
})();

render();
</script>
