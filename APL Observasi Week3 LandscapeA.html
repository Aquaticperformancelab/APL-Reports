<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APL Sprint Lab — Observasi Week 3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #161616;
    --border: #2e2e2e;
    --border-light: #242424;
    --border-strong: #4a4a4a;
    --text-primary: #f2f2f2;
    --text-secondary: #9a9a9a;
    --text-muted: #5e5e5e;
    --good: #22c55e;
    --bad: #ef4444;
    --neutral: #f59e0b;
    --col-shade: rgba(255,255,255,0.022);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    font-size: 12px;
  }

  /* ── TOOLBAR ──────────────────────────────────────── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0a0a0a;
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.03em;
    margin-right: auto;
  }
  .toolbar-title span { color: var(--neutral); }

  .save-status {
    font-size: 11px;
    color: var(--text-muted);
    margin-right: 8px;
    transition: color 0.3s;
  }
  .save-status.saved { color: var(--good); }

  .btn {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: #222; border-color: #3a3a3a; }
  .btn-primary { background: var(--neutral); color: #000; border-color: var(--neutral); }
  .btn-primary:hover { background: #fbbf24; }
  .btn-ghost { background: transparent; }
  .btn-danger { color: var(--bad); border-color: rgba(239,68,68,0.3); }
  .btn-danger:hover { background: rgba(239,68,68,0.1); }

  /* ── PRINT ────────────────────────────────────────── */
  @media print {
    @page { size: A4 landscape; margin: 7mm; }
    .toolbar { display: none; }
    body { background: #fff; color: #111; font-size: 8px; }
    .page { page-break-after: always; background: #fff; padding: 0; box-shadow: none; border-radius: 0; margin: 0; }
    .page:last-child { page-break-after: avoid; }
    .page-header { border-bottom-color: #111; }
    .page-title { color: #111; }
    .page-subtitle, .page-meta { color: #555; }
    th, td { border: 1px solid #bbb; }
    .athlete-group-start { border-left: 2.5px solid #333 !important; }
    .section-header td { background: #ededed !important; color: #111 !important; }
    .row-label { color: #111; background: #fafafa; }
    .row-sublabel { color: #555; }
    .tag-good { background: #dcfce7; color: #166534; }
    .tag-bad { background: #fee2e2; color: #991b1b; }
    .note-cell textarea { border-color: #bbb; background: #fff; color: #111; }
    .timing-input { border-color: #999; background: #fff; color: #111; }
    .subsection-header td { background: #f5f5f5 !important; color: #444 !important; }
    .col-shaded { background: #f8f8f8 !important; }
  }

  /* ── PAGE ─────────────────────────────────────────── */
  .page {
    background: var(--surface);
    border-radius: 10px;
    margin: 18px auto;
    max-width: 1320px;
    padding: 18px 22px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .page-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
  }
  .page-subtitle {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    margin-top: 3px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .page-meta {
    font-size: 10px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.6;
  }

  /* ── TABLE ────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .col-label { width: 210px; }

  /* Athlete column separation */
  .athlete-group-start { border-left: 2.5px solid var(--border-strong) !important; }
  .col-shaded { background: var(--col-shade); }

  .athlete-col-header {
    text-align: center;
    padding: 6px 3px 8px;
    border-bottom: 4px solid;
    vertical-align: bottom;
  }
  .athlete-name-cell {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    display: block;
  }
  .awal-akhir-sub { display: flex; justify-content: center; gap: 4px; margin-top: 5px; }
  .awal-akhir-sub span {
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em;
    color: var(--text-muted); width: 26px; text-align: center;
  }

  .section-header td {
    background: #1c1c1c;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-secondary);
    padding: 6px 8px; border-top: 1px solid var(--border);
  }
  .subsection-header td {
    background: #131313;
    font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 4px 8px 4px 16px; border-top: 1px solid var(--border-light);
  }

  tr.data-row td { border-top: 1px solid var(--border-light); vertical-align: middle; padding: 4px 4px; }
  tr.data-row:hover td { background: rgba(245,158,11,0.04); }
  tr.data-row:hover .col-shaded { background: rgba(245,158,11,0.05); }

  .row-label { padding: 4px 8px !important; vertical-align: top; }
  .row-label-text { font-size: 10.5px; font-weight: 600; color: var(--text-primary); line-height: 1.35; }
  .row-sublabel { font-size: 9px; color: var(--text-muted); line-height: 1.3; margin-top: 2px; }

  .tag {
    display: inline-block; font-size: 7.5px; font-weight: 700;
    letter-spacing: 0.05em; padding: 1px 4px; border-radius: 3px;
    text-transform: uppercase; vertical-align: middle; margin-left: 3px;
  }
  .tag-good { background: rgba(34,197,94,0.15); color: var(--good); }
  .tag-bad  { background: rgba(239,68,68,0.15);  color: var(--bad);  }

  .check-cell { text-align: center; vertical-align: middle; padding: 3px !important; }
  .checks { display: flex; justify-content: center; gap: 8px; }

  /* iPad-friendly larger checkboxes */
  input[type="checkbox"] {
    width: 22px; height: 22px; border: 2px solid var(--border-strong);
    border-radius: 4px; background: transparent; cursor: pointer;
    appearance: none; -webkit-appearance: none; position: relative; flex-shrink: 0;
    transition: all 0.1s;
  }
  input[type="checkbox"]:active { transform: scale(0.9); }
  input[type="checkbox"]:checked { background: var(--neutral); border-color: var(--neutral); }
  input[type="checkbox"]:checked::after {
    content: ''; position: absolute; left: 6px; top: 2px;
    width: 7px; height: 12px; border: 2.5px solid #000;
    border-top: none; border-left: none; transform: rotate(45deg);
  }
  input[type="checkbox"].good:checked { background: var(--good); border-color: var(--good); }
  input[type="checkbox"].bad:checked  { background: var(--bad);  border-color: var(--bad);  }

  .timing-cell { text-align: center; vertical-align: middle; padding: 3px !important; }
  .timing-quad { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .timing-input {
    width: 100%; height: 26px; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 4px;
    color: var(--text-primary); font-size: 11px; text-align: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .timing-input:focus { outline: none; border-color: var(--neutral); }

  .note-cell { padding: 5px 7px !important; vertical-align: top; }
  .note-cell textarea {
    width: 100%; height: 48px; background: var(--bg);
    border: 1.5px solid var(--border-light); border-radius: 4px;
    color: var(--text-primary); font-size: 9.5px;
    font-family: 'Plus Jakarta Sans', sans-serif; padding: 5px 7px;
    resize: vertical; line-height: 1.4;
  }
  .note-cell textarea::placeholder { color: var(--text-muted); }
  .note-cell textarea:focus { outline: none; border-color: var(--neutral); }

  .legend {
    display: flex; gap: 18px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--border-light); align-items: center; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 9.5px; color: var(--text-muted); }
  .legend-box { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--good); color: #000; font-weight: 700; font-size: 13px;
    padding: 12px 24px; border-radius: 9px; transition: transform 0.3s; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">APL Sprint Lab <span>·</span> Observasi Week 3</div>
  <span class="save-status" id="saveStatus">Auto-save aktif</span>
  <button class="btn btn-ghost" onclick="window.print()">Print / PDF</button>
  <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  <button class="btn" onclick="exportJSON()">Export Data (.json)</button>
  <button class="btn btn-primary" onclick="exportMD()">Export Laporan (.md)</button>
</div>

<div class="page" id="page1"></div>
<div class="page" id="page2"></div>
<div class="toast" id="toast"></div>

<script>
const athletes = [
  { name: 'Avissa',  color: '#6366f1' },
  { name: 'Tata',    color: '#ec4899' },
  { name: 'Reva',    color: '#14b8a6' },
  { name: 'Joshua',  color: '#f97316' },
  { name: 'Tasha',   color: '#8b5cf6' },
  { name: 'Saniya',  color: '#06b6d4' },
  { name: 'Dora',    color: '#84cc16' },
  { name: 'Rendra',  color: '#f43f5e' },
];

const STORAGE_KEY = 'apl_week3_observasi';

let _uid = 0;
function uid() { return 'c' + (++_uid); }
let rowCounter = 0;
function rid() { return 'r' + (++rowCounter); }

// shade alternate athlete columns for visual separation
function colClasses(i) {
  let cls = 'athlete-group-start';
  if (i % 2 === 1) cls += ' col-shaded';
  return cls;
}

function athleteHeaders() {
  let ths = `<th class="col-label"></th>`;
  athletes.forEach((a, i) => {
    ths += `
      <th class="athlete-col-header ${colClasses(i)}" style="color:${a.color}; border-bottom-color:${a.color}">
        <span class="athlete-name-cell">${a.name}</span>
        <div class="awal-akhir-sub"><span>AWAL</span><span>AKHIR</span></div>
      </th>`;
  });
  return `<thead><tr>${ths}</tr></thead>`;
}

function sectionRow(label, colspan = 9) {
  return `<tr class="section-header"><td colspan="${colspan}">${label}</td></tr>`;
}
function subsectionRow(label, colspan = 9) {
  return `<tr class="subsection-header"><td colspan="${colspan}">${label}</td></tr>`;
}

function checkRow(label, sublabel, type, rowId) {
  const cls = type === 'good' ? 'good' : type === 'bad' ? 'bad' : '';
  const tag = type === 'good'
    ? `<span class="tag tag-good">Bagus</span>`
    : type === 'bad'
    ? `<span class="tag tag-bad">Masalah</span>`
    : '';
  let tds = `
    <td class="row-label">
      <div class="row-label-text">${label}${tag}</div>
      ${sublabel ? `<div class="row-sublabel">${sublabel}</div>` : ''}
    </td>`;
  athletes.forEach((ath, i) => {
    const a = uid(), b = uid();
    tds += `
      <td class="check-cell ${colClasses(i)}">
        <div class="checks">
          <input type="checkbox" class="${cls} obs" id="${a}" data-key="${rowId}|${i}|awal" data-athlete="${i}" data-col="awal" data-label="${label}">
          <input type="checkbox" class="${cls} obs" id="${b}" data-key="${rowId}|${i}|akhir" data-athlete="${i}" data-col="akhir" data-label="${label}">
        </div>
      </td>`;
  });
  return `<tr class="data-row">${tds}</tr>`;
}

function timingRow(label, sublabel, slots, fieldKey) {
  let tds = `
    <td class="row-label">
      <div class="row-label-text">${label}</div>
      ${sublabel ? `<div class="row-sublabel">${sublabel}</div>` : ''}
    </td>`;
  athletes.forEach((ath, i) => {
    let inputs = '';
    for (let s = 1; s <= slots; s++) {
      inputs += `<input type="text" inputmode="decimal" class="timing-input quant" placeholder="${s}" data-key="quant|${fieldKey}|${i}|${s}" data-athlete="${i}" data-field="${fieldKey}" data-slot="${s}">`;
    }
    tds += `<td class="timing-cell ${colClasses(i)}"><div class="timing-quad">${inputs}</div></td>`;
  });
  return `<tr class="data-row">${tds}</tr>`;
}

function noteRow(label) {
  let tds = `<td class="row-label" style="vertical-align:middle"><div class="row-label-text">${label}</div></td>`;
  athletes.forEach((ath, i) => {
    tds += `<td class="note-cell ${colClasses(i)}"><textarea class="coachnote" data-key="note|${i}" data-athlete="${i}" placeholder="..."></textarea></td>`;
  });
  return `<tr class="data-row">${tds}</tr>`;
}

function legend() {
  return `
    <div class="legend">
      <div class="legend-item"><div class="legend-box" style="background:var(--good)"></div> Indikator bagus</div>
      <div class="legend-item"><div class="legend-box" style="background:var(--bad)"></div> Indikator masalah</div>
      <div class="legend-item"><div class="legend-box" style="background:var(--neutral)"></div> Netral / cross-check</div>
      <div class="legend-item" style="margin-left:auto; color: var(--text-muted)">
        AWAL = rep pertama &nbsp;|&nbsp; AKHIR = rep terakhir &nbsp;·&nbsp; Kesimpulan ditentukan manual oleh coach
      </div>
    </div>`;
}

// ══════ PAGE 1 ══════
document.getElementById('page1').innerHTML = `
  <div class="page-header">
    <div>
      <div class="page-title">Blok 1 — Entry Angle &amp; Arm Action</div>
      <div class="page-subtitle">APL Sprint Lab · Week 3 · Start sebagai Power Transfer · UNNES Sampangan</div>
    </div>
    <div class="page-meta">Tanggal: __________________ &nbsp;|&nbsp; Halaman 1 dari 2</div>
  </div>
  <table>
    ${athleteHeaders()}
    <tbody>
      ${sectionRow('ENTRY ANGLE — Arc &amp; Trajectory')}
      ${checkRow('Arc mengarah ke depan', 'Power diarahkan horizontal', 'good', rid())}
      ${checkRow('Arc naik tinggi ke atas dulu', 'Power terbuang ke atas', 'bad', rid())}
      ${checkRow('Arc hampir tidak ada, langsung turun', 'Drop vertikal', 'bad', rid())}

      ${sectionRow('ENTRY ANGLE — Urutan Entry')}
      ${checkRow('Tangan → kepala → perut/pinggang → kaki', 'Urutan benar', 'good', rid())}
      ${checkRow('Kepala/dagu masuk bersamaan atau lebih dulu', 'Urutan salah — curam', 'bad', rid())}
      ${checkRow('Perut/paha menyentuh air sebelum kaki', 'Urutan salah — flat', 'bad', rid())}

      ${sectionRow('ENTRY ANGLE — Momentum Tangan saat Kontak')}
      ${checkRow('Lengan miring ke depan saat kontak pertama', 'Tidak tegak lurus permukaan', 'good', rid())}
      ${checkRow('Lengan mendekati tegak lurus saat kontak', 'Momentum ke bawah — curam', 'bad', rid())}
      ${checkRow('Momentum tangan bergerak ke depan di bawah permukaan', '', 'good', rid())}
      ${checkRow('Momentum tangan bergerak ke bawah di bawah permukaan', '', 'bad', rid())}

      ${sectionRow('ENTRY ANGLE — Karakter Percikan &amp; Kedalaman')}
      ${checkRow('Percikan ke atas, bersih — satu lubang', 'Entry clean', 'good', rid())}
      ${checkRow('Percikan melebar ke samping', 'Flat', 'bad', rid())}
      ${checkRow('Percikan berbeda karakter tiap rep', 'Inconsistent', 'bad', rid())}
      ${checkRow('Kedalaman wajar relatif terhadap atlet lain', '', 'good', rid())}
      ${checkRow('Terlihat terlalu dalam relatif terhadap atlet lain', 'Entry curam', 'bad', rid())}

      ${sectionRow('ARM ACTION — Arah Momentum Tubuh')}
      ${checkRow('Tubuh terdorong maju ke depan', 'Efisien', 'good', rid())}
      ${checkRow('Tubuh terdorong naik ke atas', 'Power terbuang vertikal', 'bad', rid())}

      ${sectionRow('ARM ACTION — Style Start')}
      ${subsectionRow('Dengan Arm Swing (lempar ke belakang dulu)')}
      ${checkRow('Arm swing dan leg push sinkron', '', 'good', rid())}
      ${checkRow('Ada jeda antara arm swing dan leg push', 'Tidak sinkron', 'bad', rid())}
      ${checkRow('Lengan sweep ke depan-bawah saat leg push', '', 'good', rid())}
      ${checkRow('Lengan melempar ke belakang-atas saat leg push', 'Tidak efisien', 'bad', rid())}
      ${subsectionRow('Tanpa Arm Swing (tangan langsung ke depan)')}
      ${checkRow('Tangan dan leg push bergerak bersamaan', 'Sinkron', 'good', rid())}
      ${checkRow('Ada jeda antara gerakan tangan dan leg push', 'Tidak sinkron', 'bad', rid())}

      ${sectionRow('ARM ACTION — Streamline saat Moment of Impact')}
      ${checkRow('Tangan sudah kembali ke posisi overhead saat entry', 'Streamline terbentuk', 'good', rid())}
      ${checkRow('Tangan masih terbuka/di samping kepala saat entry', 'Streamline tidak terbentuk — pertimbangkan tanpa arm swing', 'bad', rid())}
    </tbody>
  </table>
  ${legend()}
`;

// ══════ PAGE 2 ══════
document.getElementById('page2').innerHTML = `
  <div class="page-header">
    <div>
      <div class="page-title">Blok 3 — Breakout &amp; Catatan</div>
      <div class="page-subtitle">APL Sprint Lab · Week 3 · Start sebagai Power Transfer · UNNES Sampangan</div>
    </div>
    <div class="page-meta">Tanggal: __________________ &nbsp;|&nbsp; Halaman 2 dari 2</div>
  </div>
  <table>
    ${athleteHeaders()}
    <tbody>
      ${sectionRow('DATA KUANTITATIF — 4 slot rep (isi sesuai jumlah rep yang terlaksana)')}
      ${timingRow('Waktu 25m (detik)', 'slot 1–4', 4, 'w25')}
      ${timingRow('Stroke Count', 'breakout → wall', 4, 'sc')}
      ${timingRow('Jarak Breakout (m)', 'dari dinding block', 4, 'dist')}

      ${sectionRow('JARAK BREAKOUT — Klasifikasi')}
      ${checkRow('Kurang dari 10m', 'Entry flat — kedalaman tidak optimal', 'bad', rid())}
      ${checkRow('10m – 13m', 'Zona optimal', 'good', rid())}
      ${checkRow('Lebih dari 13m', 'Cross-check dengan entry angle', 'neutral', rid())}

      ${sectionRow('JARAK BREAKOUT — Interpretasi (kombinasi dengan entry angle hal. 1)')}
      ${checkRow('Entry bagus + 10–13m', 'Power & underwater solid', 'good', rid())}
      ${checkRow('Entry curam + 10–13m', 'Underwater mengkompensasi entry dalam', 'bad', rid())}
      ${checkRow('Entry bagus + >13m', 'Underwater kick genuinely kuat', 'good', rid())}
      ${checkRow('Entry curam + >13m', 'Terlalu dalam — butuh jarak ekstra', 'bad', rid())}
      ${checkRow('Entry flat + <10m', 'Tidak dapat kedalaman', 'bad', rid())}

      ${sectionRow('ANGLE KELUAR (Tapering)')}
      ${checkRow('Tapering halus dan gradual', 'Kontrol baik', 'good', rid())}
      ${checkRow('Muncul kasar dan paksa ke permukaan', '', 'bad', rid())}

      ${sectionRow('KECEPATAN SAAT BREAKOUT')}
      ${checkRow('Terlihat ada speed saat muncul', 'Momentum terbawa', 'good', rid())}
      ${checkRow('Terlihat slow saat muncul', 'Angle keluar terlalu curam', 'bad', rid())}

      ${sectionRow('CATATAN COACH — tulis segera setelah sesi')}
      ${noteRow('Catatan')}
    </tbody>
  </table>
  ${legend()}
`;

// ══════ AUTO-SAVE ══════
let saveTimer = null;
function saveState() {
  const state = {};
  document.querySelectorAll('input.obs').forEach(c => {
    if (c.checked) state[c.getAttribute('data-key')] = true;
  });
  document.querySelectorAll('input.quant').forEach(inp => {
    if (inp.value.trim()) state[inp.getAttribute('data-key')] = inp.value;
  });
  document.querySelectorAll('textarea.coachnote').forEach(t => {
    if (t.value.trim()) state[t.getAttribute('data-key')] = t.value;
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashSaved();
  } catch (e) {
    console.warn('Save gagal:', e);
  }
}

function loadState() {
  let state;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    state = JSON.parse(raw);
  } catch (e) { return; }

  document.querySelectorAll('input.obs').forEach(c => {
    if (state[c.getAttribute('data-key')]) c.checked = true;
  });
  document.querySelectorAll('input.quant').forEach(inp => {
    const v = state[inp.getAttribute('data-key')];
    if (v !== undefined) inp.value = v;
  });
  document.querySelectorAll('textarea.coachnote').forEach(t => {
    const v = state[t.getAttribute('data-key')];
    if (v !== undefined) t.value = v;
  });
}

function flashSaved() {
  const s = document.getElementById('saveStatus');
  s.textContent = 'Tersimpan ✓';
  s.classList.add('saved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    s.textContent = 'Auto-save aktif';
    s.classList.remove('saved');
  }, 1500);
}

document.addEventListener('change', (e) => {
  if (e.target.classList.contains('obs') || e.target.classList.contains('quant')) saveState();
});
document.addEventListener('input', (e) => {
  if (e.target.classList.contains('quant') || e.target.classList.contains('coachnote')) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 600);
  }
});

function resetAll() {
  if (!confirm('Hapus semua data observasi yang tersimpan? Tindakan ini tidak bisa dibatalkan.')) return;
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('input.obs').forEach(c => c.checked = false);
  document.querySelectorAll('input.quant').forEach(inp => inp.value = '');
  document.querySelectorAll('textarea.coachnote').forEach(t => t.value = '');
  showToast('Data direset');
}

// ══════ DATA COLLECTION & EXPORT ══════
function collectData() {
  const data = {
    session: 'Week 3 — Start sebagai Power Transfer',
    venue: 'UNNES Sampangan',
    date: new Date().toISOString().slice(0, 10),
    athletes: {}
  };
  athletes.forEach((ath, i) => {
    const obs = { awal: [], akhir: [] };
    document.querySelectorAll(`input.obs[data-athlete="${i}"]:checked`).forEach(c => {
      obs[c.getAttribute('data-col')].push(c.getAttribute('data-label'));
    });
    const quant = { w25: [], sc: [], dist: [] };
    document.querySelectorAll(`input.quant[data-athlete="${i}"]`).forEach(inp => {
      const f = inp.getAttribute('data-field');
      if (inp.value.trim()) quant[f].push(inp.value.trim());
    });
    const noteEl = document.querySelector(`textarea.coachnote[data-athlete="${i}"]`);
    const note = noteEl ? noteEl.value.trim() : '';
    data.athletes[ath.name] = {
      observasi_awal: obs.awal,
      observasi_akhir: obs.akhir,
      data_kuantitatif: quant,
      catatan_coach: note
    };
  });
  return data;
}

function exportJSON() {
  download(JSON.stringify(collectData(), null, 2), 'APL_Observasi_Week3.json', 'application/json');
  showToast('Data JSON tersimpan');
}

function exportMD() {
  const data = collectData();
  let md = `# APL Sprint Lab — Laporan Observasi Week 3\n\n`;
  md += `**Sesi:** ${data.session}\n`;
  md += `**Venue:** ${data.venue}\n`;
  md += `**Tanggal:** ${data.date}\n\n`;
  md += `> Data observasi mentah dari sesi. Attach file ini ke Claude untuk dianalisa menjadi laporan per-atlet dan laporan parent-facing.\n\n`;
  md += `---\n\n`;
  athletes.forEach(ath => {
    const a = data.athletes[ath.name];
    md += `## ${ath.name}\n\n`;
    md += `### Data Kuantitatif (Blok 3)\n\n`;
    const q = a.data_kuantitatif;
    if (q.w25.length || q.sc.length || q.dist.length) {
      md += `| Rep | Waktu 25m | Stroke Count | Jarak Breakout |\n`;
      md += `|-----|-----------|--------------|----------------|\n`;
      const maxLen = Math.max(q.w25.length, q.sc.length, q.dist.length);
      for (let r = 0; r < maxLen; r++) {
        md += `| ${r+1} | ${q.w25[r] || '–'} | ${q.sc[r] || '–'} | ${q.dist[r] || '–'} |\n`;
      }
    } else { md += `_Belum ada data kuantitatif._\n`; }
    md += `\n### Trajectory Teknis (Awal → Akhir Sesi)\n\n`;
    md += `**Indikator di REP AWAL:**\n`;
    if (a.observasi_awal.length) { a.observasi_awal.forEach(o => md += `- ${o}\n`); }
    else { md += `- _Tidak ada._\n`; }
    md += `\n**Indikator di REP AKHIR:**\n`;
    if (a.observasi_akhir.length) { a.observasi_akhir.forEach(o => md += `- ${o}\n`); }
    else { md += `- _Tidak ada._\n`; }
    md += `\n### Catatan Coach\n\n`;
    md += a.catatan_coach ? `${a.catatan_coach}\n\n` : `_Belum diisi._\n\n`;
    md += `---\n\n`;
  });
  const dateStr = new Date().toISOString().slice(0,10);
  download(md, `APL_Laporan_Observasi_Week3_${dateStr}.md`, 'text/markdown');
  showToast('Laporan Markdown tersimpan');
}

function download(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

loadState();
</script>
