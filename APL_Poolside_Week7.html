<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APL Poolside — Week 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --avissa:#7F77DD; --avissa-dark:#3C3489; --avissa-tint:#EEEDFE;
    --tata:#1D9E75; --tata-dark:#085041; --tata-tint:#E1F5EE;
    --reva:#D85A30; --reva-dark:#712B13; --reva-tint:#FAECE7;
    --tasha:#D4537E; --tasha-dark:#72243E; --tasha-tint:#FBEAF0;
    --saniya:#0E8FA8; --saniya-dark:#0A4A57; --saniya-tint:#E2F3F7;
    --dora:#639922; --dora-dark:#27500A; --dora-tint:#EAF3DE;
    --rendra:#534AB7; --rendra-dark:#26215C; --rendra-tint:#EEEDFE;
    --ink:#14161A; --paper:#FAFAF8; --line:#E4E2DC; --muted:#6B6E76;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:100px}
  .topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .topbar .label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#9A9DA6;font-weight:700}
  .topbar .title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;margin-top:2px}
  .save-pill{font-size:10px;font-weight:700;padding:5px 10px;border-radius:20px;background:#2A2D34;color:#9A9DA6;white-space:nowrap}
  .save-pill.saved{background:#1D3B2A;color:#6FCF97}
  .save-pill.failed{background:#4A1F1B;color:#F09A8E}

  .athlete-tabs{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:40;scrollbar-width:none}
  .athlete-tabs::-webkit-scrollbar{display:none}
  .a-tab{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1.5px solid var(--line);white-space:nowrap;cursor:pointer;flex:none}
  .a-tab.active{background:var(--dot);color:#fff;border-color:transparent}
  .a-tab .dot{width:8px;height:8px;border-radius:50%;background:var(--dot)}
  .a-tab.active .dot{background:rgba(255,255,255,.5)}
  .a-tab .ms{font-size:9px;opacity:.75;font-weight:800}
  .a-tab .check{font-size:11px;opacity:.8}
  .a-tab .saved-mark{font-size:11px;font-weight:800;color:#2E9E63;margin-left:2px}

  main{padding:0 16px}
  .meta-bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 2px}
  .meta-chip{font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--dot-tint);color:var(--dot-dark)}
  .section-head{padding:20px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .section-head h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:17px;color:var(--dot-dark)}
  .section-head .sub{font-size:12px;color:var(--muted);font-weight:600}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .card-lbl{font-size:12.5px;font-weight:800;margin-bottom:2px}
  .card-sub{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:10px}

  .rep-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0eee8}
  .rep-row:last-child{border-bottom:none}
  .rep-num{width:30px;height:26px;border-radius:8px;background:var(--dot-tint);color:var(--dot-dark);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;flex:none;margin-top:2px}
  .rep-fields{display:flex;gap:8px;flex-wrap:wrap}
  .field{flex:1;min-width:88px}
  .field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;text-align:center;background:var(--paper)}
  .field input:focus{outline:none;border-color:var(--dot);background:#fff}
  .field.time input{color:var(--dot-dark)}
  .rep-note{margin-top:8px}
  .rep-note input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;background:var(--paper)}
  .rep-note input:focus{outline:none;border-color:var(--dot);background:#fff}
  .rep-note input::placeholder{color:#A9ABB2;font-size:11.5px}
  .stroke-tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase;margin-left:6px}
  .tag-free{background:#EEF2FF;color:#4338CA}
  .tag-ms{background:var(--dot-tint);color:var(--dot-dark)}

  .rate-block{padding:12px 0;border-bottom:1px solid #f0eee8}
  .rate-block:last-child{border-bottom:none}
  .rate-block-title{font-size:12px;font-weight:800;margin-bottom:10px;display:flex;align-items:center}
  .rate-param{display:flex;align-items:center;justify-content:space-between;padding:5px 0;gap:8px;flex-wrap:wrap}
  .rate-param-label{font-size:12.5px;font-weight:600;color:#444;flex:1;min-width:130px}
  .rate5{display:flex;gap:4px;flex:none}
  .rate5 button{width:38px;height:34px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-size:14px;font-weight:800;font-family:'JetBrains Mono',monospace;cursor:pointer;color:var(--muted);transition:all .12s}
  .rate5 button.r1{background:#FEE2E2;border-color:#F87171;color:#B91C1C}
  .rate5 button.r2{background:#FFEDD5;border-color:#FB923C;color:#9A3412}
  .rate5 button.r3{background:#FEF3C7;border-color:#FBBF24;color:#92400E}
  .rate5 button.r4{background:#DCFCE7;border-color:#4ADE80;color:#166534}
  .rate5 button.r5{background:#D1FAE5;border-color:#10B981;color:#065F46}

  .ms-selector{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
  .ms-btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--muted)}
  .ms-btn.active{background:var(--dot);color:#fff;border-color:transparent}
  .criteria-toggle{font-size:11px;font-weight:700;color:var(--dot-dark);cursor:pointer;text-decoration:underline;margin-bottom:8px;display:inline-block}
  .criteria-panel{display:none;background:#f9f8f4;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;font-size:11.5px;line-height:1.5}
  .criteria-panel.open{display:block}
  .criteria-panel h4{font-size:11.5px;font-weight:800;margin:10px 0 4px;color:var(--ink)}
  .criteria-panel h4:first-child{margin-top:0}
  .criteria-panel .cr{display:flex;gap:6px;padding:2px 0}
  .criteria-panel .cn{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:14px}

  .note-box textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;min-height:60px;resize:vertical;background:var(--paper)}
  .note-box textarea:focus{outline:none;border-color:var(--dot);background:#fff}
  .note-lbl{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}

  footer{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid var(--line);z-index:50}
  .btn-reset{flex:0 0 auto;padding:13px 14px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #E4E2DC;background:#fff;color:#B91C1C}
  .btn-export{flex:1;padding:13px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;background:var(--dot);color:#fff}
  .btn-md{flex:1;padding:13px;border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--dot);background:#fff;color:var(--dot)}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="label">APL Sprint Lab · Poolside</div>
    <div class="title">Week 7 — PAP &amp; Overspeed</div>
  </div>
  <div class="save-pill" id="savePill">belum disimpan</div>
</div>

<div class="athlete-tabs" id="athleteTabs"></div>
<main id="mainContent"></main>

<footer>
  <button class="btn-reset" onclick="resetAthlete()">Reset</button>
  <button class="btn-export" onclick="exportData()">Export TXT</button>
  <button class="btn-md" onclick="exportMD()">Export MD</button>
</footer>

<script>
// main stroke & grup stretchcordz sudah ditetapkan
const ATHLETES = [
  { key:"avissa", name:"Avissa", ms:"breast", cordz:"Hijau", grup:"Rendra + Dora + Avissa" },
  { key:"tata",   name:"Tata",   ms:"fly",    cordz:"Kuning", grup:"Tata + Tasha" },
  { key:"reva",   name:"Reva",   ms:"fly",    cordz:"Kuning", grup:"Saniya + Reva" },
  { key:"tasha",  name:"Tasha",  ms:"breast", cordz:"Kuning", grup:"Tata + Tasha" },
  { key:"saniya", name:"Saniya", ms:"back",   cordz:"Kuning", grup:"Saniya + Reva" },
  { key:"dora",   name:"Dora",   ms:"fly",    cordz:"Hijau", grup:"Rendra + Dora + Avissa" },
  { key:"rendra", name:"Rendra", ms:"free",   cordz:"Hijau", grup:"Rendra + Dora + Avissa" },
];
const MS_LABEL = { free:"Freestyle", fly:"Butterfly", back:"Backstroke", breast:"Breaststroke" };
const MS_OPTIONS = [["free","Freestyle"],["fly","Butterfly"],["back","Backstroke"],["breast","Breaststroke"]];
const DRILL_FOCUS = {
  free:   "Propulsion / Arm setup (recovery & entry)",
  fly:    "Undulation / Propulsion",
  breast: "Kicking Drills & Timing Drills",
  back:   "Body position & Rotation Drills",
};

// urutan set: 2 Free lalu 2 Main Stroke
const SET_TYPES = ["free","free","ms","ms"];

// kriteria penilaian
const CRIT_15 = [
  ["start",    "Start Block Power"],
  ["entry",    "Entry & Streamline"],
  ["uw",       "Underwater Quality"],
  ["breakout", "Breakout Transition"],
  ["intensi",  "Intensi (Max Effort)"],
];
const CRIT_25 = [
  ["transfer", "Transfer Kecepatan"],
  ["rate",     "Stroke Rate"],
  ["length",   "Stroke Length (DPS)"],
  ["bodypos",  "Body Position"],
  ["maintain", "Speed Maintenance"],
];

const STD_15 = {
  start: ["Dorongan lemah, hampir tidak ada tolakan","Ada dorongan tapi lemah, jarak masuk air pendek","Dorongan cukup, arah sudah benar","Dorongan kuat dan terarah","Eksplosif penuh, jarak masuk air jauh"],
  entry: ["Masuk air berantakan, percikan besar, badan tidak lurus","Sudut belum konsisten, streamline cepat lepas","Entry cukup bersih, streamline terjaga sebentar","Entry bersih, streamline lurus dan tahan","Entry sangat bersih, streamline terkunci penuh"],
  uw: ["Kick lemah atau tidak ada, langsung naik","Kick ada tapi kecil, dorongan minim","Kick cukup, jumlah konsisten","Kick kuat dan konsisten, jarak terjaga","Kick sangat kuat, jarak maksimal dan stabil"],
  uwBreast: ["Pullout tidak tuntas, timing kacau","Pullout lemah, jarak pendek","Pullout cukup, satu pull satu kick jelas","Pullout kuat, jarak baik","Pullout maksimal, timing dan jarak optimal"],
  breakout: ["Kepala naik duluan, kecepatan patah","Breakout terburu-buru, momentum hilang","Breakout cukup mulus","Breakout mulus, momentum terbawa","Transisi sempurna, tanpa kehilangan kecepatan"],
  intensi: ["Jelas sub-max, seperti pemanasan","Effort naik bertahap, baru penuh di akhir","Cukup, tapi masih terasa ada yang disimpan","Effort penuh hampir sejak awal","Max effort sejak stroke pertama"],
};
const STD_25 = {
  transfer: ["Tidak ada transfer, sama seperti tanpa assisted","Sedikit terasa di awal lalu hilang","Transfer terasa di 10m pertama","Transfer terasa jelas sampai pertengahan","Transfer terbawa penuh sampai akhir"],
  rate: ["Sangat lambat, tidak sesuai sprint","Lambat dan cepat turun","Cukup, tapi tidak stabil","Tinggi dan cukup stabil","Tinggi dan stabil sampai akhir"],
  length: ["Sangat boros, tarikan terpotong","Boros, jarak per tarikan pendek","Cukup, sesekali terpotong","Panjang dan konsisten","Optimal, jarak per tarikan maksimal"],
  bodypos: ["Badan tenggelam, drag besar","Sering turun, tidak konsisten","Cukup terjaga, sesekali turun","Terjaga baik hampir sepanjang","Terjaga sempurna sampai dinding"],
  maintain: ["Kecepatan jatuh drastis setelah 15m","Turun jelas di 10m terakhir","Turun sedikit di akhir","Hampir terjaga sampai akhir","Terjaga penuh sampai dinding"],
};

const STORE_KEY = "apl_week7_data_v1";

function loadStore(){ try{ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
function writeStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); return true; }catch(e){ setSavePill("gagal menyimpan",false); return false; } }
function setSavePill(t,ok){ const p=document.getElementById('savePill'); if(!p)return; p.textContent=t; p.classList.toggle('saved',!!ok); p.classList.remove('failed'); }

let saveTimers={};
function autosave(key){
  setSavePill("menyimpan...",false);
  clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(()=>{
    const d=ensureAthlete(key);
    d.savedAt=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    if(writeStore()){
      const who=(ATHLETES.find(x=>x.key===key)||{}).name||key;
      setSavePill(`${who} tersimpan ${d.savedAt}`,true);
      renderTabs();
    }
  },400);
}
function flushSave(key){
  if(key&&saveTimers[key]){ clearTimeout(saveTimers[key]);
    const d=ensureAthlete(key);
    d.savedAt=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  }
  writeStore();
}

function emptyRateSet(crits){ const o={}; crits.forEach(([k])=>o[k]=null); return o; }
function emptyAthleteData(defMs){
  return {
    mainStroke: defMs || "free",
    drills: { free:"", ms:"", umum:"" },
    s15: SET_TYPES.map((t,i)=>({ set:i+1, type:t, time:null, uw:null, sc:null })),
    s25: SET_TYPES.map((t,i)=>({ set:i+1, type:t, time:null, uw:null, sc:null })),
    note15: "",
    note25: "",
    r15: { free: emptyRateSet(CRIT_15), ms: emptyRateSet(CRIT_15) },
    r25: { free: emptyRateSet(CRIT_25), ms: emptyRateSet(CRIT_25) },
    coachNote: "",
    savedAt: "",
  };
}
function normalizeAthlete(raw, defMs){
  const b=emptyAthleteData(defMs);
  if(!raw||typeof raw!=='object') return b;
  if(raw.mainStroke && MS_LABEL[raw.mainStroke]) b.mainStroke=raw.mainStroke;
  if(raw.drills) ['free','ms','umum'].forEach(k=>{ if(typeof raw.drills[k]==='string') b.drills[k]=raw.drills[k]; });
  ['s15','s25'].forEach(sk=>{
    if(Array.isArray(raw[sk])) for(let i=0;i<4;i++){
      const r=raw[sk][i]; if(!r||typeof r!=='object') continue;
      b[sk][i].time=r.time??null;
      b[sk][i].uw=r.uw??null;
      b[sk][i].sc=r.sc??null;
    }
  });
  if(typeof raw.note15==='string') b.note15=raw.note15;
  if(typeof raw.note25==='string') b.note25=raw.note25;
  [['r15',CRIT_15],['r25',CRIT_25]].forEach(([rk,crits])=>{
    if(raw[rk]) ['free','ms'].forEach(blk=>{
      if(raw[rk][blk]) crits.forEach(([c])=>{ if(raw[rk][blk][c]!==undefined) b[rk][blk][c]=raw[rk][blk][c]; });
    });
  });
  if(typeof raw.coachNote==='string') b.coachNote=raw.coachNote;
  if(typeof raw.savedAt==='string') b.savedAt=raw.savedAt;
  return b;
}

let store=loadStore();
let activeKey=ATHLETES[0].key;
ATHLETES.forEach(a=>{ store[a.key]=normalizeAthlete(store[a.key], a.ms); });
function ensureAthlete(k){
  if(!store[k]){ const a=ATHLETES.find(x=>x.key===k); store[k]=emptyAthleteData(a?a.ms:"free"); }
  return store[k];
}
function msOf(k){ return ensureAthlete(k).mainStroke; }

function renderTabs(){
  const wrap=document.getElementById('athleteTabs');
  wrap.innerHTML='';
  ATHLETES.forEach(a=>{
    const d=ensureAthlete(a.key);
    const filled=d.s15.filter(x=>x.time!==null&&x.time!=="").length + d.s25.filter(x=>x.time!==null&&x.time!=="").length;
    const tab=document.createElement('div');
    tab.className='a-tab'+(a.key===activeKey?' active':'');
    tab.style.setProperty('--dot',`var(--${a.key})`);
    tab.onclick=()=>{ flushSave(activeKey); activeKey=a.key; render(); };
    const mark=d.savedAt?`<span class="saved-mark">✓</span>`:'';
    tab.innerHTML=`<span class="dot"></span>${a.name}<span class="ms">${d.mainStroke.toUpperCase()}</span>${filled>0?`<span class="check">${filled}/8</span>`:''}${mark}`;
    wrap.appendChild(tab);
  });
}

function fieldUpdate(key,path,value){
  const d=ensureAthlete(key); const ks=path.split('.');
  let o=d;
  for(let i=0;i<ks.length-1;i++){ const k=isNaN(ks[i])?ks[i]:parseInt(ks[i]); o=o[k]; }
  const last=ks[ks.length-1];
  o[isNaN(last)?last:parseInt(last)]=value;
  autosave(key);
}
function tapUpdate(key,path,value){ fieldUpdate(key,path,value); render(); }

let openPanel={c15:false,c25:false};

// Set Free selalu UW Kick. Pullout hanya untuk set main stroke gaya dada.
function uwLabelFor(setType, ms){
  return (setType==='ms' && ms==='breast') ? 'Pullout (m)' : 'UW Kick';
}
function uwIsBreast(setType, ms){ return setType==='ms' && ms==='breast'; }

function rateRow(aKey, storePath, cur, label){
  let h=`<div class="rate-param"><div class="rate-param-label">${label}</div><div class="rate5">`;
  for(let n=1;n<=5;n++){
    h+=`<button class="${cur===n?'r'+n:''}" onclick="tapUpdate('${aKey}','${storePath}',${cur===n?'null':n})">${n}</button>`;
  }
  return h+`</div></div>`;
}

function critPanel(id, crits, std, isBreast){
  let h=`<div class="criteria-panel${openPanel[id]?' open':''}">`;
  crits.forEach(([k,lab])=>{
    const arr = (k==='uw' && isBreast) ? std.uwBreast : std[k];
    const shownLabel = (k==='uw' && isBreast) ? 'Pullout Quality' : lab;
    h+=`<h4>${shownLabel}</h4>`;
    arr.forEach((t,i)=>{ h+=`<div class="cr"><span class="cn">${i+1}</span> ${t}</div>`; });
  });
  return h+`</div>`;
}

function render(){
  renderTabs();
  const a=ATHLETES.find(x=>x.key===activeKey);
  const d=ensureAthlete(activeKey);
  const main=document.getElementById('mainContent');
  document.documentElement.style.setProperty('--dot',`var(--${a.key})`);
  main.style.setProperty('--dot',`var(--${a.key})`);
  main.style.setProperty('--dot-dark',`var(--${a.key}-dark)`);
  main.style.setProperty('--dot-tint',`var(--${a.key}-tint)`);

  const ms=d.mainStroke;
  const isBreast=ms==='breast';
  const uwLabel=isBreast?'Pullout (m)':'UW Kick';
  const msLabel=MS_LABEL[ms];
  let h='';

  h+=`<div class="meta-bar">
    <span class="meta-chip">Cordz: ${a.cordz}</span>
    <span class="meta-chip">Grup: ${a.grup}</span>
  </div>`;
  h+=`<div class="section-head"><h2>Main Stroke</h2><span class="sub">ubah kalau anak pindah gaya</span></div>`;
  h+=`<div class="ms-selector">`;
  MS_OPTIONS.forEach(([k,lab])=>{
    h+=`<button class="ms-btn${ms===k?' active':''}" onclick="tapUpdate('${a.key}','mainStroke','${k}')">${lab}</button>`;
  });
  h+=`</div>`;

  // ---------- 1. DRILLS ----------
  h+=`<div class="section-head"><h2>1. Drills Set</h2><span class="sub">16x50 · 8 Free + 8 Main Stroke</span></div>`;
  h+=`<div class="card note-box">
    <label class="note-lbl">Drill Freestyle — ${DRILL_FOCUS.free}</label>
    <textarea placeholder="catatan drill free..." oninput="fieldUpdate('${a.key}','drills.free',this.value)">${d.drills.free||''}</textarea>
  </div>`;
  h+=`<div class="card note-box">
    <label class="note-lbl">Drill ${msLabel} — ${DRILL_FOCUS[ms]}</label>
    <textarea placeholder="catatan drill main stroke..." oninput="fieldUpdate('${a.key}','drills.ms',this.value)">${d.drills.ms||''}</textarea>
  </div>`;
  h+=`<div class="card note-box">
    <label class="note-lbl">Catatan umum drill (opsional)</label>
    <textarea placeholder="hal lain yang terlihat saat drill..." oninput="fieldUpdate('${a.key}','drills.umum',this.value)">${d.drills.umum||''}</textarea>
  </div>`;

  // ---------- 2. 15m MAX ----------
  h+=`<div class="section-head"><h2>2. Sprint 15m MAX</h2><span class="sub">Pre-Set · parachute + isometric → 15m dive</span></div>`;
  h+=`<div class="card"><div class="card-lbl">Waktu per set</div><div class="card-sub">Set 1-2 Free · Set 3-4 ${msLabel}</div>`;
  d.s15.forEach((r,i)=>{
    const tag=r.type==='free'?`<span class="stroke-tag tag-free">Free</span>`:`<span class="stroke-tag tag-ms">${msLabel}</span>`;
    const ul=uwLabelFor(r.type,ms), ub=uwIsBreast(r.type,ms);
    h+=`<div class="rep-row">
      <div class="rep-num">S${r.set}</div>
      <div style="flex:1">
        <div style="margin-bottom:6px;font-size:12px;font-weight:700;color:var(--muted)">Set ${r.set}${tag}</div>
        <div class="rep-fields">
          <div class="field time"><label>Waktu 15m</label>
            <input type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${r.time??''}"
              oninput="fieldUpdate('${a.key}','s15.${i}.time',this.value)"></div>
          <div class="field"><label>${ul}</label>
            <input type="number" step="${ub?'0.5':'1'}" inputmode="${ub?'decimal':'numeric'}" placeholder="0" value="${r.uw??''}"
              oninput="fieldUpdate('${a.key}','s15.${i}.uw',this.value)"></div>
          <div class="field"><label>Stroke Count</label>
            <input type="number" step="1" inputmode="numeric" placeholder="0" value="${r.sc??''}"
              oninput="fieldUpdate('${a.key}','s15.${i}.sc',this.value)"></div>
        </div>
      </div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><div class="card-lbl">Penilaian kualitas 15m</div>
    <div class="card-sub">dinilai per gaya, bukan per set</div>
    <span class="criteria-toggle" onclick="openPanel.c15=!openPanel.c15;render();">${openPanel.c15?'▼ Tutup':'▶ Lihat'} standar penilaian 1-5</span>
    ${critPanel('c15',CRIT_15,STD_15,isBreast)}`;
  [['free','Blok Free'],['ms',`Blok ${msLabel}`]].forEach(([blk,lab])=>{
    h+=`<div class="rate-block"><div class="rate-block-title">${lab}</div>`;
    CRIT_15.forEach(([k,label])=>{
      const shown=(k==='uw'&&isBreast)?'Pullout Quality':label;
      h+=rateRow(a.key,`r15.${blk}.${k}`,d.r15[blk][k],shown);
    });
    h+=`</div>`;
  });
  h+=`<div class="note-box" style="margin-top:12px">
    <label class="note-lbl">Catatan sprint 15m</label>
    <textarea placeholder="catatan pengamatan 15m — cth: tolakan kurang di set awal, breakout lambat di set MS" oninput="fieldUpdate('${a.key}','note15',this.value)">${d.note15||''}</textarea>
  </div>`;
  h+=`</div>`;

  // ---------- 3. 25m MAX ----------
  h+=`<div class="section-head"><h2>3. Sprint 25m MAX</h2><span class="sub">Main Set · assisted → 25m dive</span></div>`;
  h+=`<div class="card"><div class="card-lbl">Waktu per set</div><div class="card-sub">Set 1-2 Free · Set 3-4 ${msLabel}</div>`;
  d.s25.forEach((r,i)=>{
    const tag=r.type==='free'?`<span class="stroke-tag tag-free">Free</span>`:`<span class="stroke-tag tag-ms">${msLabel}</span>`;
    const ul=uwLabelFor(r.type,ms), ub=uwIsBreast(r.type,ms);
    h+=`<div class="rep-row">
      <div class="rep-num">S${r.set}</div>
      <div style="flex:1">
        <div style="margin-bottom:6px;font-size:12px;font-weight:700;color:var(--muted)">Set ${r.set}${tag}</div>
        <div class="rep-fields">
          <div class="field time"><label>Waktu 25m</label>
            <input type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${r.time??''}"
              oninput="fieldUpdate('${a.key}','s25.${i}.time',this.value)"></div>
          <div class="field"><label>${ul}</label>
            <input type="number" step="${ub?'0.5':'1'}" inputmode="${ub?'decimal':'numeric'}" placeholder="0" value="${r.uw??''}"
              oninput="fieldUpdate('${a.key}','s25.${i}.uw',this.value)"></div>
          <div class="field"><label>Stroke Count</label>
            <input type="number" step="1" inputmode="numeric" placeholder="0" value="${r.sc??''}"
              oninput="fieldUpdate('${a.key}','s25.${i}.sc',this.value)"></div>
        </div>
      </div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><div class="card-lbl">Penilaian kualitas 25m</div>
    <div class="card-sub">dinilai per gaya, bukan per set</div>
    <span class="criteria-toggle" onclick="openPanel.c25=!openPanel.c25;render();">${openPanel.c25?'▼ Tutup':'▶ Lihat'} standar penilaian 1-5</span>
    ${critPanel('c25',CRIT_25,STD_25,false)}`;
  [['free','Blok Free'],['ms',`Blok ${msLabel}`]].forEach(([blk,lab])=>{
    h+=`<div class="rate-block"><div class="rate-block-title">${lab}</div>`;
    CRIT_25.forEach(([k,label])=>{ h+=rateRow(a.key,`r25.${blk}.${k}`,d.r25[blk][k],label); });
    h+=`</div>`;
  });
  h+=`<div class="note-box" style="margin-top:12px">
    <label class="note-lbl">Catatan sprint 25m</label>
    <textarea placeholder="catatan pengamatan 25m — cth: transfer terasa jelas, rate turun di 10m akhir" oninput="fieldUpdate('${a.key}','note25',this.value)">${d.note25||''}</textarea>
  </div>`;
  h+=`</div>`;

  // ---------- catatan coach ----------
  h+=`<div class="section-head"><h2>Catatan Coach</h2></div>`;
  h+=`<div class="card note-box">
    <textarea placeholder="observasi umum atlet ini hari ini..." oninput="fieldUpdate('${a.key}','coachNote',this.value)">${d.coachNote||''}</textarea>
  </div>`;

  main.innerHTML=h;
}

function resetAthlete(){
  const who=ATHLETES.find(x=>x.key===activeKey).name;
  if(!confirm(`Reset semua data ${who} untuk Week 7?`)) return;
  clearTimeout(saveTimers[activeKey]);
  store[activeKey]=emptyAthleteData(ATHLETES.find(x=>x.key===activeKey).ms);
  writeStore(); setSavePill(`${who} direset`,false); render();
}

function critLines(crits,std,isBreast,vals){
  return crits.map(([k,lab])=>{
    const shown=(k==='uw'&&isBreast)?'Pullout Quality':lab;
    return `      ${shown}: ${vals[k]??'-'}`;
  }).join('\n');
}

function exportData(){
  const L=[];
  L.push("APL SPRINT LAB — WEEK 7 DATA EXPORT");
  L.push("PAP & Overspeed — "+new Date().toLocaleDateString('id-ID'));
  L.push("=".repeat(52));
  ATHLETES.forEach(a=>{
    const d=ensureAthlete(a.key);
    const isBreast=d.mainStroke==='breast';
    const msLabel=MS_LABEL[d.mainStroke];
    L.push("");
    L.push(`--- ${a.name.toUpperCase()} [${msLabel}] · Cordz ${a.cordz} ---`);
    L.push(`Grup assisted: ${a.grup}`);
    L.push("");
    L.push("1. DRILLS SET");
    L.push(`  Drill Free (${DRILL_FOCUS.free}): ${d.drills.free||'-'}`);
    L.push(`  Drill ${msLabel} (${DRILL_FOCUS[d.mainStroke]}): ${d.drills.ms||'-'}`);
    if(d.drills.umum) L.push(`  Catatan umum: ${d.drills.umum}`);
    L.push("");
    L.push("2. SPRINT 15m MAX");
    d.s15.forEach(r=>{
      const st=r.type==='free'?'Free':msLabel;
      const ul=(r.type==='ms'&&isBreast)?'Pullout':'UW';
      L.push(`  Set ${r.set} [${st}]: ${r.time??'-'}s / ${ul} ${r.uw??'-'} / SC ${r.sc??'-'}`);
    });
    L.push("  Penilaian kualitas (1-5):");
    L.push("    Blok Free:");
    L.push(critLines(CRIT_15,STD_15,isBreast,d.r15.free));
    L.push(`    Blok ${msLabel}:`);
    L.push(critLines(CRIT_15,STD_15,isBreast,d.r15.ms));
    if(d.note15) L.push(`  Catatan 15m: ${d.note15}`);
    L.push("");
    L.push("3. SPRINT 25m MAX");
    d.s25.forEach(r=>{
      const st=r.type==='free'?'Free':msLabel;
      const ul=(r.type==='ms'&&isBreast)?'Pullout':'UW';
      L.push(`  Set ${r.set} [${st}]: ${r.time??'-'}s / ${ul} ${r.uw??'-'} / SC ${r.sc??'-'}`);
    });
    L.push("  Penilaian kualitas (1-5):");
    L.push("    Blok Free:");
    L.push(critLines(CRIT_25,STD_25,false,d.r25.free));
    L.push(`    Blok ${msLabel}:`);
    L.push(critLines(CRIT_25,STD_25,false,d.r25.ms));
    if(d.note25) L.push(`  Catatan 25m: ${d.note25}`);
    if(d.coachNote){ L.push(""); L.push(`Catatan Coach: ${d.coachNote}`); }
  });
  const blob=new Blob([L.join('\n')+"\n\n\n=== RAW JSON ===\n"+JSON.stringify(store,null,2)],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=`APL_Week7_Data_${new Date().toISOString().slice(0,10)}.txt`;
  link.click(); URL.revokeObjectURL(url);
}

function buildMarkdown(){
  const date=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  const L=[];
  L.push(`# APL Sprint Lab — Laporan Sesi Week 7`);
  L.push(`**PAP & Overspeed**`);
  L.push(`**Tanggal:** ${date}  `);
  L.push(`**Kolam:** UNNES Sampangan · 50m`);
  L.push(''); L.push('---'); L.push('');
  ATHLETES.forEach(a=>{
    const d=ensureAthlete(a.key);
    const isBreast=d.mainStroke==='breast';
    const msLabel=MS_LABEL[d.mainStroke];
    L.push(`## ${a.name}`);
    L.push(`> **Main Stroke:** ${msLabel} · **Cordz:** ${a.cordz} · **Grup:** ${a.grup}`);
    L.push('');
    L.push('### 1. Drills Set');
    L.push('');
    L.push(`**Drill Freestyle** — _${DRILL_FOCUS.free}_`);
    L.push(d.drills.free||'—');
    L.push('');
    L.push(`**Drill ${msLabel}** — _${DRILL_FOCUS[d.mainStroke]}_`);
    L.push(d.drills.ms||'—');
    if(d.drills.umum){ L.push(''); L.push(`_Catatan umum: ${d.drills.umum}_`); }
    L.push('');
    L.push('### 2. Sprint 15m MAX');
    L.push('');
    L.push(`| Set | Gaya | Waktu | UW / Pullout | Stroke Count |`);
    L.push(`|-----|------|-------|--------------|--------------|`);
    d.s15.forEach(r=>{
      const ul=(r.type==='ms'&&isBreast)?'m':'';
      L.push(`| ${r.set} | ${r.type==='free'?'Free':msLabel} | ${r.time??'—'}s | ${r.uw??'—'}${r.uw!=null&&ul?' m':''} | ${r.sc??'—'} |`);
    });
    L.push('');
    L.push(`| Kriteria | Free | ${msLabel} |`);
    L.push(`|----------|------|${'-'.repeat(msLabel.length)}|`);
    CRIT_15.forEach(([k,lab])=>{
      const shown=(k==='uw'&&isBreast)?'Pullout Quality':lab;
      L.push(`| ${shown} | ${d.r15.free[k]??'—'} | ${d.r15.ms[k]??'—'} |`);
    });
    if(d.note15){ L.push(''); L.push(`_Catatan 15m: ${d.note15}_`); }
    L.push('');
    L.push('### 3. Sprint 25m MAX');
    L.push('');
    L.push(`| Set | Gaya | Waktu | UW / Pullout | Stroke Count |`);
    L.push(`|-----|------|-------|--------------|--------------|`);
    d.s25.forEach(r=>{
      const ul=(r.type==='ms'&&isBreast)?'m':'';
      L.push(`| ${r.set} | ${r.type==='free'?'Free':msLabel} | ${r.time??'—'}s | ${r.uw??'—'}${r.uw!=null&&ul?' m':''} | ${r.sc??'—'} |`);
    });
    L.push('');
    L.push(`| Kriteria | Free | ${msLabel} |`);
    L.push(`|----------|------|${'-'.repeat(msLabel.length)}|`);
    CRIT_25.forEach(([k,lab])=>L.push(`| ${lab} | ${d.r25.free[k]??'—'} | ${d.r25.ms[k]??'—'} |`));
    if(d.note25){ L.push(''); L.push(`_Catatan 25m: ${d.note25}_`); }
    if(d.coachNote){ L.push(''); L.push('### Catatan Coach'); L.push(''); L.push(`> ${d.coachNote}`); }
    L.push(''); L.push('---'); L.push('');
  });
  L.push(`_Export: ${new Date().toLocaleString('id-ID')} · APL Sprint Lab Week 7_`);
  return L.join('\n');
}
function exportMD(){
  const blob=new Blob([buildMarkdown()],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=`APL_Week7_${new Date().toISOString().slice(0,10)}.md`;
  link.click(); URL.revokeObjectURL(url);
}
