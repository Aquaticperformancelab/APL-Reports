<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APL Sprint Lab — Observasi Week 3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f0f0f; --surface: #161616; --border: #2e2e2e; --border-light: #242424;
    --border-strong: #4a4a4a; --text-primary: #f2f2f2; --text-secondary: #9a9a9a;
    --text-muted: #5e5e5e; --good: #22c55e; --bad: #ef4444; --neutral: #f59e0b;
    --col-shade: rgba(255,255,255,0.022);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-primary); font-size: 12px; }

  .toolbar { position: sticky; top: 0; z-index: 100; background: #0a0a0a; border-bottom: 1px solid var(--border); padding: 12px 22px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.03em; margin-right: auto; }
  .toolbar-title span { color: var(--neutral); }
  .save-status { font-size: 11px; color: var(--text-muted); margin-right: 8px; transition: color 0.3s; }
  .save-status.saved { color: var(--good); }
  .btn { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #222; border-color: #3a3a3a; }
  .btn-primary { background: var(--neutral); color: #000; border-color: var(--neutral); }
  .btn-primary:hover { background: #fbbf24; }
  .btn-ghost { background: transparent; }
  .btn-danger { color: var(--bad); border-color: rgba(239,68,68,0.3); }
  .btn-danger:hover { background: rgba(239,68,68,0.1); }

  @media print {
    @page { size: A4 landscape; margin: 7mm; }
    .toolbar { display: none; }
    body { background: #fff; color: #111; font-size: 8px; }
    .page { page-break-after: always; background: #fff; padding: 0; box-shadow: none; border-radius: 0; margin: 0; }
    .page:last-child { page-break-after: avoid; }
    .page-header { border-bottom-color: #111; }
    .page-title { color: #111; }
    .page-subtitle, .page-meta { color: #555; }
    th, td { border: 1px solid #bbb; }
    .athlete-group-start { border-left: 2.5px solid #333 !important; }
    .section-header td { background: #ededed !important; color: #111 !important; }
    .row-label { color: #111; background: #fafafa; }
    .row-key { color: #555; }
    .col-shaded { background: #f8f8f8 !important; }
    .ref-box { background: #f8f8f8 !important; border-color: #ccc !important; }
    .ref-cell { color: #222 !important; }
    .quant-card, .note-block { border: 1.5px solid #ccc; background: #fff; page-break-inside: avoid; }
    .score-input { border-color: #999 !important; }
    .yn-btn { border-color: #999 !important; color:#333 !important; }
    .yn-btn.yes.active { background:#22c55e !important; color:#fff !important; }
    .yn-btn.no.active { background:#ef4444 !important; color:#fff !important; }
    .conc-badge { border: 1px solid #999; }
  }

  .page { background: var(--surface); border-radius: 10px; margin: 18px auto; max-width: 1320px; padding: 18px 22px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .page-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; }
  .page-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-primary); }
  .page-subtitle { font-size: 10px; font-weight: 500; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }
  .page-meta { font-size: 10px; color: var(--text-muted); text-align: right; line-height: 1.6; }

  .ref-box { background: #131313; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .ref-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--neutral); margin-bottom: 10px; }
  .ref-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ref-dim { border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; }
  .ref-dim-head { font-size: 10.5px; font-weight: 700; padding: 6px 9px; background: #1c1c1c; color: var(--text-primary); }
  .ref-dim-head .nonlinear { font-size: 8px; color: var(--neutral); font-weight: 600; display: block; margin-top: 1px; }
  .ref-row { display: flex; gap: 8px; padding: 6px 9px; border-top: 1px solid var(--border-light); }
  .ref-score { flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
  .ref-score.s1 { background: var(--bad); color:#fff; }
  .ref-score.s2 { background: var(--neutral); color:#111; }
  .ref-score.s3 { background: var(--good); color:#111; }
  .ref-cell { font-size: 9px; line-height: 1.35; color: var(--text-secondary); }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .col-label { width: 250px; }
  .athlete-group-start { border-left: 2.5px solid var(--border-strong) !important; }
  .col-shaded { background: var(--col-shade); }

  .athlete-col-header { text-align: center; padding: 6px 3px 8px; border-bottom: 4px solid; vertical-align: bottom; }
  .athlete-name-cell { font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; display: block; }
  .awal-akhir-sub { display: flex; justify-content: center; gap: 6px; margin-top: 5px; }
  .awal-akhir-sub span { font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-muted); flex: 1; text-align: center; }

  .section-header td { background: #1c1c1c; font-family: 'Bricolage Grotesque', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); padding: 6px 8px; border-top: 1px solid var(--border); }
  .section-header .hint { color: var(--neutral); font-weight: 700; letter-spacing: 0.04em; text-transform: none; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9px; margin-left: 6px; }

  tr.data-row td { border-top: 1px solid var(--border-light); vertical-align: middle; padding: 5px 4px; }
  tr.data-row:hover td { background: rgba(245,158,11,0.04); }
  tr.data-row:hover .col-shaded { background: rgba(245,158,11,0.05); }
  .row-label { padding: 6px 8px !important; vertical-align: middle; }
  .row-label-text { font-size: 11px; font-weight: 600; color: var(--text-primary); line-height: 1.35; }
  .row-key { font-size: 8.5px; color: var(--text-muted); line-height: 1.4; margin-top: 3px; }
  .row-key b { color: var(--text-secondary); font-weight: 700; }

  /* SCORE INPUT — single column awal/akhir */
  .score-cell { padding: 5px 5px !important; vertical-align: middle; }
  .score-pair { display: flex; gap: 8px; justify-content: center; }
  .score-input {
    width: 40px; height: 36px; border: 2px solid var(--border-strong); border-radius: 7px;
    background: var(--bg); color: var(--text-primary); text-align: center;
    font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800;
    transition: all 0.12s;
  }
  .score-input:focus { outline: none; border-color: var(--neutral); }
  .score-input.s1 { background: var(--bad); border-color: var(--bad); color: #fff; }
  .score-input.s2 { background: var(--neutral); border-color: var(--neutral); color: #111; }
  .score-input.s3 { background: var(--good); border-color: var(--good); color: #111; }

  /* YES/NO buttons (arm action) */
  .yn-cell { padding: 5px 4px !important; vertical-align: middle; text-align: center; }
  .yn-pair { display: flex; gap: 5px; justify-content: center; }
  .yn-btn {
    width: 38px; height: 30px; border: 2px solid var(--border-strong); border-radius: 6px;
    background: transparent; color: var(--text-secondary);
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700;
    cursor: pointer; transition: all 0.1s;
  }
  .yn-btn:active { transform: scale(0.9); }
  .yn-btn.yes.active { background: var(--good); border-color: var(--good); color: #111; }
  .yn-btn.no.active { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* Conclusion row */
  .conc-row td { border-top: 2px solid var(--border); vertical-align: middle; padding: 7px 4px; background: #121212; }
  .conc-label { padding: 7px 8px !important; }
  .conc-label .row-label-text { color: var(--neutral); font-weight: 700; }
  .conc-cell { text-align: center; }
  .conc-badge { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em; padding: 4px 8px; border-radius: 6px; line-height: 1.25; }
  .conc-badge.empty { color: var(--text-muted); border: 1px dashed var(--border); }
  .conc-badge.cocok { background: var(--good); color: #111; }
  .conc-badge.belum { background: var(--bad); color: #fff; }

  /* Note row for arm action */
  .armnote-cell { padding: 5px 6px !important; vertical-align: top; }
  .armnote-cell textarea { width: 100%; height: 44px; background: var(--bg); border: 1.5px solid var(--border-light); border-radius: 5px; color: var(--text-primary); font-size: 9.5px; font-family: 'Plus Jakarta Sans', sans-serif; padding: 5px 6px; resize: vertical; line-height: 1.4; }
  .armnote-cell textarea:focus { outline: none; border-color: var(--neutral); }

  /* QUANT */
  .quant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .quant-card { background: #131313; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .quant-card-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-light); }
  .quant-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .quant-card-name { font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 700; }
  .quant-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .quant-table th { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 7px 4px 5px; text-align: center; }
  .quant-table th.rep-col { width: 42px; }
  .quant-table td { padding: 4px 5px; text-align: center; }
  .quant-table td.rep-label { font-family: 'Bricolage Grotesque', sans-serif; font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .timing-input { width: 100%; height: 30px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 5px; color: var(--text-primary); font-size: 13px; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; }
  .timing-input:focus { outline: none; border-color: var(--neutral); }
  .quant-note { font-size: 9px; color: var(--text-muted); padding: 6px 14px 10px; font-style: italic; }

  .note-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .note-block { background: #131313; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .note-block-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .note-block-name { font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 700; }
  .note-block textarea { width: 100%; height: 70px; background: var(--bg); border: 1.5px solid var(--border-light); border-radius: 6px; color: var(--text-primary); font-size: 11px; font-family: 'Plus Jakarta Sans', sans-serif; padding: 7px 9px; resize: vertical; line-height: 1.45; }
  .note-block textarea:focus { outline: none; border-color: var(--neutral); }

  .legend { display: flex; gap: 18px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-light); align-items: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 9.5px; color: var(--text-muted); }
  .legend-box { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--good); color: #000; font-weight: 700; font-size: 13px; padding: 12px 24px; border-radius: 9px; transition: transform 0.3s; z-index: 200; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">APL Sprint Lab <span>·</span> Observasi Week 3</div>
  <span class="save-status" id="saveStatus">Auto-save aktif</span>
  <button class="btn btn-ghost" onclick="window.print()">Print / PDF</button>
  <button class="btn btn-danger" onclick="resetAll()">Reset</button>
  <button class="btn" onclick="exportJSON()">Export Data (.json)</button>
  <button class="btn btn-primary" onclick="exportMD()">Export Laporan (.md)</button>
</div>

<div class="page" id="page1"></div>
<div class="page" id="page2"></div>
<div class="page" id="page3"></div>
<div class="toast" id="toast"></div>

<script>
const athletes = [
  { name: 'Avissa', color: '#6366f1' },
  { name: 'Tata',   color: '#ec4899' },
  { name: 'Reva',   color: '#14b8a6' },
  { name: 'Joshua', color: '#f97316' },
  { name: 'Tasha',  color: '#8b5cf6' },
  { name: 'Saniya', color: '#06b6d4' },
  { name: 'Dora',   color: '#84cc16' },
  { name: 'Rendra', color: '#f43f5e' },
];
const STORAGE_KEY = 'apl_week3_observasi_v6';

const DIMENSIONS = [
  { key: 'arc', name: 'Arc & Trajectory', nonlinear: false,
    keyline: '<b>1</b> Vertikal/naik · <b>2</b> Sebagian horizontal · <b>3</b> Horizontal penuh',
    desc: { 1: 'Arc naik vertikal ke atas dulu, atau drop langsung vertikal. Power tidak ke depan.', 2: 'Ada komponen horizontal tapi arc masih terlalu tinggi/curam. Power sebagian terbuang.', 3: 'Arc sepenuhnya ke depan-bawah. Power horizontal, tidak ada fase naik signifikan.' } },
  { key: 'urutan', name: 'Urutan Entry', nonlinear: false,
    keyline: '<b>1</b> Jatuh bersamaan · <b>2</b> Atas berurutan, bawah flat · <b>3</b> Satu lubang penuh',
    desc: { 1: 'Tangan, kepala, perut, kaki jatuh hampir bersamaan. Flat parah, tidak ada satu lubang.', 2: 'Tangan & kepala berurutan, tapi pinggang & kaki masuk bersamaan. Satu lubang sebagian, bawah flat.', 3: 'Tangan, kepala, perut/pinggang, kaki berurutan & bersih. Satu lubang penuh.' } },
  { key: 'percikan', name: 'Karakter Percikan', nonlinear: false,
    keyline: '<b>1</b> Melebar samping · <b>2</b> Campuran · <b>3</b> Bersih ke atas',
    desc: { 1: 'Percikan melebar lebar ke samping. Tidak bersih, resistansi tinggi.', 2: 'Percikan sebagian ke atas sebagian ke samping. Cukup bersih, belum satu lubang penuh.', 3: 'Percikan ke atas bersih. Satu lubang, tidak ada percikan ke samping.' } },
  { key: 'dalam', name: 'Kedalaman Post-Entry', nonlinear: true,
    keyline: '<b>1</b> Terlalu dangkal · <b>2</b> Terlalu dalam · <b>3</b> Optimal',
    desc: { 1: 'Terlalu dangkal. Tidak ada ruang underwater, speed langsung hilang di permukaan.', 2: 'Terlalu dalam. Speed berpotensi hilang saat breakout, bisa diselamatkan kalau underwater kuat.', 3: 'Optimal. Ada ruang glide & underwater, speed terbawa.' } },
];

// Arm action yes/no indicators
const ARM_Q = [
  { key: 'q1', text: 'Timing arm swing selaras dengan leg push' },
  { key: 'q2', text: 'Tangan cepat kembali ke posisi streamline' },
  { key: 'q3', text: 'Ayunan tangan bantu badan lebih horizontal ke depan' },
];

function colClasses(i) { let cls = 'athlete-group-start'; if (i % 2 === 1) cls += ' col-shaded'; return cls; }

function athleteHeadersScore() {
  let ths = `<th class="col-label"></th>`;
  athletes.forEach((a, i) => {
    ths += `<th class="athlete-col-header ${colClasses(i)}" style="color:${a.color}; border-bottom-color:${a.color}"><span class="athlete-name-cell">${a.name}</span><div class="awal-akhir-sub"><span>AWAL</span><span>AKHIR</span></div></th>`;
  });
  return `<thead><tr>${ths}</tr></thead>`;
}
function athleteHeadersPlain() {
  let ths = `<th class="col-label"></th>`;
  athletes.forEach((a, i) => {
    ths += `<th class="athlete-col-header ${colClasses(i)}" style="color:${a.color}; border-bottom-color:${a.color}"><span class="athlete-name-cell">${a.name}</span></th>`;
  });
  return `<thead><tr>${ths}</tr></thead>`;
}

function sectionRow(label, hint) {
  const h = hint ? `<span class="hint">${hint}</span>` : '';
  return `<tr class="section-header"><td colspan="9">${label}${h}</td></tr>`;
}

// SCORE ROW — manual number input, single column awal/akhir
function scoreRow(dim) {
  let tds = `<td class="row-label"><div class="row-label-text">${dim.name}</div><div class="row-key">${dim.keyline}</div></td>`;
  athletes.forEach((ath, i) => {
    const inp = (col) => `<input type="text" inputmode="numeric" maxlength="1" class="score-input" data-dim="${dim.key}" data-athlete="${i}" data-col="${col}" placeholder="–">`;
    tds += `<td class="score-cell ${colClasses(i)}"><div class="score-pair">${inp('awal')}${inp('akhir')}</div></td>`;
  });
  return `<tr class="data-row">${tds}</tr>`;
}

// ARM Q ROW — yes/no per athlete (single judgment for session)
function armQRow(q) {
  let tds = `<td class="row-label"><div class="row-label-text">${q.text}</div></td>`;
  athletes.forEach((ath, i) => {
    tds += `<td class="yn-cell ${colClasses(i)}"><div class="yn-pair">
      <button class="yn-btn yes" data-arm="${q.key}" data-athlete="${i}" data-val="yes">Ya</button>
      <button class="yn-btn no"  data-arm="${q.key}" data-athlete="${i}" data-val="no">Tidak</button>
    </div></td>`;
  });
  return `<tr class="data-row">${tds}</tr>`;
}

function armConclusionRow() {
  let tds = `<td class="row-label conc-label"><div class="row-label-text">▸ KESIMPULAN STYLE</div></td>`;
  athletes.forEach((ath, i) => {
    tds += `<td class="conc-cell ${colClasses(i)}"><span class="conc-badge empty" id="armconc_${i}">—</span></td>`;
  });
  return `<tr class="conc-row">${tds}</tr>`;
}

function armNoteRow() {
  let tds = `<td class="row-label"><div class="row-label-text">Catatan Arm Action</div><div class="row-key">opsional — mis. potensi pakai arm swing tapi belum bisa hari ini, atau indikator mana yang perlu perbaikan</div></td>`;
  athletes.forEach((ath, i) => {
    tds += `<td class="armnote-cell ${colClasses(i)}"><textarea class="armnote" data-athlete="${i}" placeholder="..."></textarea></td>`;
  });
  return `<tr class="data-row">${tds}</tr>`;
}

function refBox() {
  let dims = DIMENSIONS.map(d => {
    let rows = [1,2,3].map(s => `<div class="ref-row"><div class="ref-score s${s}">${s}</div><div class="ref-cell">${d.desc[s]}</div></div>`).join('');
    return `<div class="ref-dim"><div class="ref-dim-head">${d.name}${d.nonlinear ? '<span class="nonlinear">skala tidak linear — 1 & 2 sama-sama bukan optimal</span>' : ''}</div>${rows}</div>`;
  }).join('');
  return `<div class="ref-box"><div class="ref-title">Standar Penilaian 1–3</div><div class="ref-grid">${dims}</div></div>`;
}

function legend() {
  return `<div class="legend">
    <div class="legend-item"><div class="legend-box" style="background:var(--bad)"></div> Skor 1</div>
    <div class="legend-item"><div class="legend-box" style="background:var(--neutral)"></div> Skor 2</div>
    <div class="legend-item"><div class="legend-box" style="background:var(--good)"></div> Skor 3</div>
    <div class="legend-item" style="margin-left:auto; color: var(--text-muted)">Ketik 1–3 untuk AWAL (rep pertama) & AKHIR (rep terakhir) · Arm action: mayoritas Ya = cocok arm swing</div>
  </div>`;
}

// ════════ PAGE 1 ════════
document.getElementById('page1').innerHTML = `
  <div class="page-header">
    <div><div class="page-title">Blok 1 — Penilaian Lompatan</div>
      <div class="page-subtitle">APL Sprint Lab · Week 3 · Start sebagai Power Transfer · UNNES Sampangan</div></div>
    <div class="page-meta">Tanggal: __________________ &nbsp;|&nbsp; Halaman 1 dari 3</div>
  </div>
  ${refBox()}
  <table>${athleteHeadersScore()}<tbody>
    ${sectionRow('ENTRY ANGLE — Penilaian Skor 1–3', 'ketik angka 1–3 di kolom awal & akhir')}
    ${scoreRow(DIMENSIONS[0])}
    ${scoreRow(DIMENSIONS[1])}
    ${scoreRow(DIMENSIONS[2])}
    ${scoreRow(DIMENSIONS[3])}
  </tbody></table>

  <div style="margin-top:8px"></div>
  <table>${athleteHeadersPlain()}<tbody>
    ${sectionRow('ARM ACTION — Cocok Pakai Arm Swing?', 'satu penilaian per sesi · pilih Ya / Tidak')}
    ${armQRow(ARM_Q[0])}
    ${armQRow(ARM_Q[1])}
    ${armQRow(ARM_Q[2])}
    ${armConclusionRow()}
    ${armNoteRow()}
  </tbody></table>
  ${legend()}
`;

// ════════ PAGE 2 — QUANT ════════
let quantHtml = '';
athletes.forEach((a, i) => {
  let rows = '';
  for (let r = 1; r <= 4; r++) {
    rows += `<tr>
      <td class="rep-label">${r}</td>
      <td><input type="text" inputmode="decimal" class="timing-input quant" data-key="quant|w25|${i}|${r}"  data-athlete="${i}" data-field="w25"  data-slot="${r}"></td>
      <td><input type="text" inputmode="numeric" class="timing-input quant" data-key="quant|sc|${i}|${r}"   data-athlete="${i}" data-field="sc"   data-slot="${r}"></td>
      <td><input type="text" inputmode="decimal" class="timing-input quant" data-key="quant|dist|${i}|${r}" data-athlete="${i}" data-field="dist" data-slot="${r}"></td>
    </tr>`;
  }
  quantHtml += `<div class="quant-card">
      <div class="quant-card-head"><div class="quant-dot" style="background:${a.color}"></div><div class="quant-card-name" style="color:${a.color}">${a.name}</div></div>
      <table class="quant-table">
        <thead><tr><th class="rep-col">Rep</th><th>Waktu 25m</th><th>Stroke Count</th><th>Breakout (m)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="quant-note">Breakout dicatat sebagai data mentah. Penilaian breakout dilakukan di sesi terpisah.</div>
    </div>`;
});
document.getElementById('page2').innerHTML = `
  <div class="page-header">
    <div><div class="page-title">Blok 3 — Data Kuantitatif</div>
      <div class="page-subtitle">APL Sprint Lab · Week 3 · Isi sesuai jumlah rep yang terlaksana (maks 4)</div></div>
    <div class="page-meta">Tanggal: __________________ &nbsp;|&nbsp; Halaman 2 dari 3</div>
  </div>
  <div class="quant-grid">${quantHtml}</div>
`;

// ════════ PAGE 3 — NOTES ════════
let noteHtml = '';
athletes.forEach((a, i) => {
  noteHtml += `<div class="note-block">
      <div class="note-block-head"><div class="quant-dot" style="background:${a.color}"></div><div class="note-block-name" style="color:${a.color}">${a.name}</div></div>
      <textarea class="coachnote" data-key="note|${i}" data-athlete="${i}" placeholder="Kesimpulan kategori entry angle, perubahan awal → akhir, penilaian inconsistent, cue breakout, fokus PR..."></textarea>
    </div>`;
});
document.getElementById('page3').innerHTML = `
  <div class="page-header">
    <div><div class="page-title">Catatan Coach</div>
      <div class="page-subtitle">APL Sprint Lab · Week 3 · Tulis segera setelah sesi</div></div>
    <div class="page-meta">Tanggal: __________________ &nbsp;|&nbsp; Halaman 3 dari 3</div>
  </div>
  <div class="note-grid">${noteHtml}</div>
`;

// ════════ SCORE INPUT behavior ════════
document.addEventListener('input', (e) => {
  if (e.target.classList.contains('score-input')) {
    let v = e.target.value.replace(/[^123]/g, '');
    if (v.length > 1) v = v.slice(-1);
    e.target.value = v;
    e.target.classList.remove('s1','s2','s3');
    if (v) e.target.classList.add('s' + v);
    clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 300);
  } else if (e.target.classList.contains('quant') || e.target.classList.contains('coachnote') || e.target.classList.contains('armnote')) {
    clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 600);
  }
});

// ════════ ARM Y/N behavior + auto conclusion ════════
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.yn-btn');
  if (!btn) return;
  const q = btn.getAttribute('data-arm');
  const ath = btn.getAttribute('data-athlete');
  const wasActive = btn.classList.contains('active');
  document.querySelectorAll(`.yn-btn[data-arm="${q}"][data-athlete="${ath}"]`).forEach(b => b.classList.remove('active'));
  if (!wasActive) btn.classList.add('active');
  computeArmConclusion(ath);
  saveState();
});

function computeArmConclusion(ath) {
  let yes = 0, answered = 0;
  ARM_Q.forEach(q => {
    const y = document.querySelector(`.yn-btn[data-arm="${q.key}"][data-athlete="${ath}"][data-val="yes"]`);
    const n = document.querySelector(`.yn-btn[data-arm="${q.key}"][data-athlete="${ath}"][data-val="no"]`);
    if (y.classList.contains('active')) { yes++; answered++; }
    else if (n.classList.contains('active')) { answered++; }
  });
  const badge = document.getElementById('armconc_' + ath);
  if (answered === 0) { badge.className = 'conc-badge empty'; badge.textContent = '—'; return; }
  if (yes >= 2) { badge.className = 'conc-badge cocok'; badge.textContent = `COCOK ARM SWING (${yes}/3 Ya)`; }
  else { badge.className = 'conc-badge belum'; badge.textContent = `BELUM COCOK (${yes}/3 Ya)`; }
}

// ════════ AUTO-SAVE ════════
let saveTimer = null;
function saveState() {
  const state = {};
  document.querySelectorAll('.score-input').forEach(inp => { if (inp.value) state[`score|${inp.getAttribute('data-dim')}|${inp.getAttribute('data-athlete')}|${inp.getAttribute('data-col')}`] = inp.value; });
  document.querySelectorAll('.yn-btn.active').forEach(b => { state[`arm|${b.getAttribute('data-arm')}|${b.getAttribute('data-athlete')}`] = b.getAttribute('data-val'); });
  document.querySelectorAll('input.quant').forEach(inp => { if (inp.value.trim()) state[inp.getAttribute('data-key')] = inp.value; });
  document.querySelectorAll('textarea.armnote').forEach(t => { if (t.value.trim()) state[`armnote|${t.getAttribute('data-athlete')}`] = t.value; });
  document.querySelectorAll('textarea.coachnote').forEach(t => { if (t.value.trim()) state[t.getAttribute('data-key')] = t.value; });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); flashSaved(); } catch (e) { console.warn(e); }
}
function loadState() {
  let state;
  try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return; state = JSON.parse(raw); } catch (e) { return; }
  Object.keys(state).forEach(k => {
    if (k.startsWith('score|')) {
      const [, dim, ath, col] = k.split('|');
      const inp = document.querySelector(`.score-input[data-dim="${dim}"][data-athlete="${ath}"][data-col="${col}"]`);
      if (inp) { inp.value = state[k]; inp.classList.add('s' + state[k]); }
    } else if (k.startsWith('arm|')) {
      const [, q, ath] = k.split('|');
      const btn = document.querySelector(`.yn-btn[data-arm="${q}"][data-athlete="${ath}"][data-val="${state[k]}"]`);
      if (btn) btn.classList.add('active');
    } else if (k.startsWith('armnote|')) {
      const ath = k.split('|')[1];
      const t = document.querySelector(`textarea.armnote[data-athlete="${ath}"]`);
      if (t) t.value = state[k];
    }
  });
  document.querySelectorAll('input.quant').forEach(inp => { const v = state[inp.getAttribute('data-key')]; if (v !== undefined) inp.value = v; });
  document.querySelectorAll('textarea.coachnote').forEach(t => { const v = state[t.getAttribute('data-key')]; if (v !== undefined) t.value = v; });
  athletes.forEach((a, i) => computeArmConclusion(i));
}
function flashSaved() {
  const s = document.getElementById('saveStatus');
  s.textContent = 'Tersimpan ✓'; s.classList.add('saved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { s.textContent = 'Auto-save aktif'; s.classList.remove('saved'); }, 1500);
}
function resetAll() {
  if (!confirm('Hapus semua data observasi yang tersimpan? Tindakan ini tidak bisa dibatalkan.')) return;
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('.score-input').forEach(inp => { inp.value = ''; inp.classList.remove('s1','s2','s3'); });
  document.querySelectorAll('.yn-btn.active').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.conc-badge').forEach(b => { b.className = 'conc-badge empty'; b.textContent = '—'; });
  document.querySelectorAll('input.quant').forEach(inp => inp.value = '');
  document.querySelectorAll('textarea.armnote, textarea.coachnote').forEach(t => t.value = '');
  showToast('Data direset');
}

// ════════ EXPORT ════════
function collectData() {
  const data = { session: 'Week 3 — Start sebagai Power Transfer', venue: 'UNNES Sampangan', date: new Date().toISOString().slice(0,10), athletes: {} };
  athletes.forEach((ath, i) => {
    const scores = {};
    DIMENSIONS.forEach(d => {
      const aw = document.querySelector(`.score-input[data-dim="${d.key}"][data-athlete="${i}"][data-col="awal"]`);
      const ak = document.querySelector(`.score-input[data-dim="${d.key}"][data-athlete="${i}"][data-col="akhir"]`);
      scores[d.key] = { name: d.name, awal: aw && aw.value ? aw.value : null, akhir: ak && ak.value ? ak.value : null };
    });
    const armAnswers = {}; let yes = 0, answered = 0;
    ARM_Q.forEach(q => {
      const y = document.querySelector(`.yn-btn[data-arm="${q.key}"][data-athlete="${i}"][data-val="yes"]`);
      const n = document.querySelector(`.yn-btn[data-arm="${q.key}"][data-athlete="${i}"][data-val="no"]`);
      let v = null;
      if (y.classList.contains('active')) { v = 'Ya'; yes++; answered++; }
      else if (n.classList.contains('active')) { v = 'Tidak'; answered++; }
      armAnswers[q.text] = v;
    });
    let armConc = null;
    if (answered > 0) armConc = yes >= 2 ? `Cocok arm swing (${yes}/3 Ya)` : `Belum cocok arm swing (${yes}/3 Ya)`;
    const armNoteEl = document.querySelector(`textarea.armnote[data-athlete="${i}"]`);
    const quant = { w25: [], sc: [], dist: [] };
    document.querySelectorAll(`input.quant[data-athlete="${i}"]`).forEach(inp => { const f = inp.getAttribute('data-field'); if (inp.value.trim()) quant[f].push(inp.value.trim()); });
    const noteEl = document.querySelector(`textarea.coachnote[data-athlete="${i}"]`);
    data.athletes[ath.name] = {
      skor_entry_angle: scores,
      arm_action: { jawaban: armAnswers, kesimpulan: armConc, catatan: armNoteEl ? armNoteEl.value.trim() : '' },
      data_kuantitatif: quant,
      catatan_coach: noteEl ? noteEl.value.trim() : ''
    };
  });
  return data;
}
function exportJSON() { download(JSON.stringify(collectData(), null, 2), 'APL_Observasi_Week3.json', 'application/json'); showToast('Data JSON tersimpan'); }
function exportMD() {
  const data = collectData();
  let md = `# APL Sprint Lab — Laporan Observasi Week 3\n\n**Sesi:** ${data.session}\n**Venue:** ${data.venue}\n**Tanggal:** ${data.date}\n\n> Skor entry angle 1–3 (Kedalaman tidak linear). Arm action: mayoritas Ya = cocok arm swing. Attach file ini ke Claude untuk dibuat laporan.\n\n---\n\n`;
  athletes.forEach(ath => {
    const a = data.athletes[ath.name];
    md += `## ${ath.name}\n\n### Skor Entry Angle (Awal → Akhir)\n\n| Dimensi | Awal | Akhir |\n|---------|------|-------|\n`;
    Object.values(a.skor_entry_angle).forEach(s => { md += `| ${s.name} | ${s.awal || '–'} | ${s.akhir || '–'} |\n`; });
    md += `\n### Arm Action — Cocok Arm Swing?\n\n`;
    Object.entries(a.arm_action.jawaban).forEach(([q, v]) => { md += `- ${q}: **${v || '–'}**\n`; });
    md += `\n**Kesimpulan:** ${a.arm_action.kesimpulan || '_belum dinilai_'}\n`;
    if (a.arm_action.catatan) md += `**Catatan:** ${a.arm_action.catatan}\n`;
    md += `\n### Data Kuantitatif (Blok 3)\n\n`;
    const q = a.data_kuantitatif;
    if (q.w25.length || q.sc.length || q.dist.length) {
      md += `| Rep | Waktu 25m | Stroke Count | Breakout (m) |\n|-----|-----------|--------------|--------------|\n`;
      const maxLen = Math.max(q.w25.length, q.sc.length, q.dist.length);
      for (let r = 0; r < maxLen; r++) md += `| ${r+1} | ${q.w25[r] || '–'} | ${q.sc[r] || '–'} | ${q.dist[r] || '–'} |\n`;
    } else { md += `_Belum ada data kuantitatif._\n`; }
    md += `\n### Catatan Coach\n\n${a.catatan_coach ? a.catatan_coach : '_Belum diisi._'}\n\n---\n\n`;
  });
  download(md, `APL_Laporan_Observasi_Week3_${new Date().toISOString().slice(0,10)}.md`, 'text/markdown');
  showToast('Laporan Markdown tersimpan');
}
function download(content, filename, type) {
  const blob = new Blob([content], { type }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

loadState();
</script>
