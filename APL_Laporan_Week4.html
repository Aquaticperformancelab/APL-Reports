<html lang="id">
<head>
<meta charset="UTF-8">

<title>APL Sprint Lab — Laporan Week 4</title>

<style>
:root {
  --bg: #f3efe6;
  --surface: #ffffff;
  --border: #e4ddd0;
  --text-primary: #22201c;
  --text-secondary: #55504a;
  --text-muted: #8a8377;
  --radius-lg: 18px;
  --radius-md: 12px;
  --font-display: 'Bricolage Grotesque', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-body);
  background-color: var(--bg);
  background-image: radial-gradient(circle, #ded6c4 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text-primary);
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ---------- SELECTOR ---------- */
#selector-page { max-width: 720px; margin: 0 auto; padding: 48px 20px 60px; }
.selector-header { text-align: center; margin-bottom: 36px; }
.program-label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
.selector-header h1 { font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.session-tag { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; }

.athlete-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.athlete-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px 16px; text-align: left; position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.03);
  transition: transform 0.15s ease;
}
.athlete-btn:active { transform: scale(0.98); }
.accent-bar { position: absolute; top: 0; left: 0; width: 100%; height: 5px; }
.initials { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: #fff; margin: 6px 0 12px; }
.athlete-btn .name { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin-bottom: 4px; }
.athlete-btn .status-pill { font-size: 11.5px; color: var(--text-muted); }

/* ---------- REPORT PAGE ---------- */
#report-page { display: none; }
.report-hero { padding: 40px 20px 26px; color: #fff; position: relative; }
.hero-inner { max-width: 720px; margin: 0 auto; }
.back-btn { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; margin-bottom: 18px; display: inline-flex; align-items: center; gap: 5px; }
.hero-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85; margin-bottom: 6px; }
.hero-name { font-family: var(--font-display); font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.hero-meta { font-size: 13.5px; opacity: 0.9; margin-top: 6px; }

.tabs-wrap { background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
.tabs { max-width: 720px; margin: 0 auto; display: flex; gap: 4px; padding: 10px 20px 0; overflow-x: auto; }
.tab-btn { padding: 10px 14px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); border-radius: 10px 10px 0 0; white-space: nowrap; }
.tab-btn.active { color: var(--text-primary); background: var(--surface); border: 1px solid var(--border); border-bottom: none; }

.tab-content { display: none; max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
.tab-content.active { display: block; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
.card h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.card p { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 10px; }
.card p:last-child { margin-bottom: 0; }

.strength-chip { display: inline-flex; align-items: center; gap: 6px; background: #eef7f0; color: #2e7d4f; font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 20px; margin-bottom: 12px; }
.strength-chip::before { content: "✓"; font-weight: 800; }

.focus-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.focus-bar-row:last-child { margin-bottom: 0; }
.focus-label { font-size: 13.5px; font-weight: 600; flex: 1; }
.focus-segs { display: flex; gap: 3px; }
.seg { width: 22px; height: 7px; border-radius: 4px; background: #e4ddd0; }
.seg.on-utama { background: #e0604f; }
.seg.on-sedang { background: #e0a72e; }
.seg.on-baik { background: #4caf7d; }

.divider { height: 1px; background: var(--border); margin: 18px 0; }

.homework-block { margin-bottom: 18px; }
.homework-block:last-child { margin-bottom: 0; }
.homework-block h4 { font-family: var(--font-display); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
.hw-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; line-height: 1.55; }
.hw-item:last-child { border-bottom: none; }
.hw-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #c9c1b2; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: 0.15s; }
.hw-check.checked { background: var(--acc); border-color: var(--acc); }
.hw-text.checked-text { text-decoration: line-through; color: var(--text-muted); }

.progress-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.progress-ring-num { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.progress-sub { font-size: 12.5px; color: var(--text-muted); }

.parent-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
.parent-block h3 { font-family: var(--font-display); font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.parent-block p { font-size: 14px; line-height: 1.75; color: var(--text-secondary); }

.session-note-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin: 0 auto 0; max-width: 720px; }
</style>
</head>

    focus: [{label:"Posisi kepala saat breakout", level:"sedang"},{label:"Konsistensi jarak breakout", level:"sedang"},{label:"Power & konsistensi start", level:"baik"}],
    indepth: "Dora sudah di level yang matang, power lompatannya bagus dan start-nya termasuk paling konsisten di kelompok. Fokus sekarang bukan lagi hal-hal dasar, tapi detail halus yang membedakan perenang bagus dengan perenang yang benar-benar elite. Yang paling kelihatan, kepalanya sering masih tenggelam di dua kayuhan pertama setelah breakout, padahal badan dan tangannya sudah keluar dengan timing yang pas. Ini juga kemungkinan berhubungan dengan jarak breakout-nya yang kadang tidak konsisten, rata-rata di 14 meter tapi kadang cuma sampai 12.5 meter, karena posisi kepala yang tidak optimal bisa mengurangi efisiensi tendangan bawah air. Di level Dora, detail sekecil ini yang menentukan selisih 0.1 sampai 0.2 detik saat race, jumlah yang berarti di kompetisi. Untuk memperbaikinya butuh kedisiplinan memperhatikan hal-hal kecil ini secara konsisten, bukan latihan kekuatan tambahan, karena fondasinya sudah kuat.",

      ]}
    },

let currentAthlete = null;
const homeworkState = {};

function levelWidth(level) { return level === "utama" ? 1 : level === "sedang" ? 2 : 3; }
function levelClass(level) { return "on-" + level; }

function renderGrid() {
  const grid = document.getElementById('athleteGrid');
  grid.innerHTML = '';
  Object.keys(ATHLETES).forEach(key => {
    const a = ATHLETES[key];
    const btn = document.createElement('button');
    btn.className = 'athlete-btn';
    btn.onclick = () => openReport(key);
    btn.innerHTML = `
      <div class="accent-bar" style="background:linear-gradient(90deg, ${a.color1}, ${a.color2})"></div>
      <div class="initials" style="background:${a.color1}">${a.init}</div>
      <div class="name">${a.name}</div>
      <div class="status-pill">${a.status}</div>`;
    grid.appendChild(btn);
  });
}

function openReport(key) {
  currentAthlete = key;
  const a = ATHLETES[key];
  document.getElementById('selector-page').style.display = 'none';
  document.getElementById('report-page').style.display = 'block';
  document.getElementById('reportHero').style.background = `linear-gradient(135deg, ${a.color1}, ${a.color2})`;
  document.getElementById('heroName').textContent = a.name;
  document.getElementById('heroMeta').textContent = a.status;

  if (a.absent) {
    document.getElementById('tab-ringkasan').innerHTML = `<div class="card"><h3>Status Sesi</h3><p>${a.ringkasan}</p></div>`;
    document.getElementById('tab-profil').innerHTML = `<div class="card"><p>Belum ada data untuk ditampilkan minggu ini.</p></div>`;
    if (a.homework && a.homework.dryland) {
      document.getElementById('tab-homework').innerHTML = `
        <div class="card">
          <div class="homework-block">
            <h4>Dryland (Prioritas) · ${a.homework.dryland.freq}</h4>
            ${a.homework.dryland.items.map(item => `
              <div class="hw-item">
                <div class="hw-check" style="--acc:${a.color1}" onclick="toggleHw('dryland', ${a.homework.dryland.items.indexOf(item)}, this)"></div>
                <div class="hw-text">${item}</div>
              </div>`).join('')}
          </div>
        </div>`;
    } else {
      document.getElementById('tab-homework').innerHTML = `<div class="card"><p>Belum ada penugasan homework minggu ini karena tidak ada sesi yang diikuti.</p></div>`;
    }
    document.getElementById('tab-orangtua').innerHTML = `<div class="parent-block"><h3>Untuk Orang Tua</h3><p>${a.parent || "Reva tidak hadir di sesi Week 4."}</p></div>`;
    switchTab('ringkasan', document.querySelector('.tab-btn'));
    window.scrollTo(0,0);
    return;
  }

  document.getElementById('tab-ringkasan').innerHTML = `
    <div class="strength-chip">${a.strength}</div>
    <div class="card"><h3>Ringkasan Sesi</h3><p>${a.ringkasan}</p></div>
  `;

  document.getElementById('tab-profil').innerHTML = `
    <div class="card">
      <h3>Fokus Latihan</h3>
      ${a.focus.map(f => `
        <div class="focus-bar-row">
          <span class="focus-label">${f.label}</span>
          <div class="focus-segs">
            ${[1,2,3].map(i => `<div class="seg ${i <= levelWidth(f.level) ? levelClass(f.level) : ''}"></div>`).join('')}
          </div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h3>Analisis Mendalam</h3>
      <p>${a.indepth}</p>
    </div>
  `;

  const hwBlocks = [];
  if (a.homework.dryland) hwBlocks.push({ title: "Dryland (Prioritas)" + (a.homework.dryland.freq ? " · " + a.homework.dryland.freq : ""), items: a.homework.dryland.items, key: "dryland" });
  if (a.homework.dryland2) hwBlocks.push({ title: "Dryland (Tambahan)" + (a.homework.dryland2.freq ? " · " + a.homework.dryland2.freq : ""), items: a.homework.dryland2.items, key: "dryland2" });
  if (a.homework.pool) hwBlocks.push({ title: "Pool (Pendukung)", items: a.homework.pool.items, key: "pool" });

  homeworkState[key] = homeworkState[key] || {};
  const totalItems = hwBlocks.reduce((s, b) => s + b.items.length, 0);

  document.getElementById('tab-homework').innerHTML = `
    <div class="card">
      <div class="progress-wrap">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="#e4ddd0" stroke-width="6"/>
          <circle id="progressCircle" cx="26" cy="26" r="22" fill="none" stroke="${a.color1}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${2*Math.PI*22}" stroke-dashoffset="${2*Math.PI*22}" transform="rotate(-90 26 26)"/>
        </svg>
        <div>
          <div class="progress-ring-num" id="progressNum">0/${totalItems}</div>
          <div class="progress-sub">selesai minggu ini</div>
        </div>
      </div>
      ${hwBlocks.map(block => `
        <div class="homework-block">
          <h4>${block.title}</h4>
          ${block.items.map((item, i) => `
            <div class="hw-item">
              <div class="hw-check" style="--acc:${a.color1}" onclick="toggleHw('${block.key}', ${i}, this)"></div>
              <div class="hw-text">${item}</div>
            </div>`).join('')}
        </div>`).join('')}
    </div>
  `;

  document.getElementById('tab-orangtua').innerHTML = `
    <div class="parent-block">
      <h3>Untuk Orang Tua</h3>
      <p>${a.parent}</p>
    </div>
  `;

  switchTab('ringkasan', document.querySelector('.tab-btn'));
  window.scrollTo(0,0);
}

function toggleHw(blockKey, idx, el) {
  const key = blockKey + '_' + idx;
  const a = ATHLETES[currentAthlete];
  homeworkState[currentAthlete][key] = !homeworkState[currentAthlete][key];
  const checked = homeworkState[currentAthlete][key];
  el.classList.toggle('checked', checked);
  el.textContent = checked ? '✓' : '';
  el.nextElementSibling.classList.toggle('checked-text', checked);

  const allChecks = document.querySelectorAll('.hw-check');
  const doneCount = Array.from(allChecks).filter(c => c.classList.contains('checked')).length;
  const total = allChecks.length;
  document.getElementById('progressNum').textContent = `${doneCount}/${total}`;
  const circle = document.getElementById('progressCircle');
  const circumference = 2 * Math.PI * 22;
  circle.style.strokeDashoffset = circumference - (doneCount/total) * circumference;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function goBack() {
  document.getElementById('report-page').style.display = 'none';
  document.getElementById('selector-page').style.display = 'block';
  window.scrollTo(0,0);
}

renderGrid();

// Session note prepended to selector page
const noteEl = document.createElement('div');
noteEl.className = 'session-note-card';
noteEl.style.marginBottom = '20px';
noteEl.innerHTML = `<h3 style="font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:10px;">${SESSION_NOTE.title}</h3><p style="font-size:14px;line-height:1.75;color:var(--text-secondary);">${SESSION_NOTE.body}</p>`;
document.querySelector('#selector-page').insertBefore(noteEl, document.getElementById('athleteGrid'));
</script>
</body>
